name: release

# Builds the official Centinelo Phone 2.0 Community edition (core + shell,
# this public repo only - no premium module, see "Community edition" in
# .claude/skills/release-ci/SKILL.md and shell/README.md "Premium module
# loader") for macOS (aarch64) + Windows (x86_64), signs the Tauri updater
# artifacts, and publishes a GitHub Release with a latest.json manifest
# matching shell/README.md's "Contract for release-ci" EXACTLY (that
# section is the source of truth this workflow implements - read it before
# changing anything here).
#
# ---------------------------------------------------------------------
# Trigger design (2026-07-17, release-ci pass) - NOT a plain `tags: v*`
# ---------------------------------------------------------------------
# build.yml (v1 Electron, still live at this repo's root - package.json/
# src/ - alongside v2's core/+shell/) already has `on.push.tags: ['v*']`
# and runs `electron-builder --publish always` on that trigger, which
# creates/updates a GitHub Release for the pushed tag and uploads v1
# installers + electron-builder's own latest.yml to it. `v*` matches ANY
# tag starting with the letter "v" - there is no v2-shaped semver tag
# ("v2.1.0", "v2-2.1.0", etc.) that avoids that filter, since it has no
# second-segment anchor. Two workflows racing to create/populate the SAME
# GitHub Release (v1's Electron installers + v2's Tauri ones, mixed
# together) is a real correctness bug, not a hypothetical one - v1.0.0 is
# already tagged and published this way (see `gh release list`).
#
# Per CLAUDE.md / AGENT-PROTOCOL.md this repo's release-ci scope is
# explicit: "No tocar main de phone/ salvo hotfix v1 explicitamente
# pedido - y NO romper el build.yml de v1." Changing build.yml's own
# trigger to carve out v2 tags would touch that file for a v2 concern,
# which is exactly what that rule exists to prevent. The only change that
# stays entirely on this workflow's own side of the fence is picking a
# tag *namespace* that can never match `v*` in the first place - hence
# `centinelo-v*` (e.g. `centinelo-v2.1.0`) instead of a bare `v*` tag.
# The auto-updater endpoint itself doesn't care either way: it's GitHub's
# `.../releases/latest/download/latest.json` alias (tauri.conf.json's
# `plugins.updater.endpoints`), which resolves by "most recent non-
# prerelease release", not by tag name shape - see "Create GitHub
# Release" below for why this workflow still passes `--latest` explicitly
# rather than relying on that default.
#
# ---------------------------------------------------------------------
# Prerelease default (2026-08-13, release-ci pass) - safe on BOTH trigger
# paths, not just one
# ---------------------------------------------------------------------
# The two trigger types used to disagree on what "no explicit choice"
# means: `workflow_dispatch`'s `prerelease` input defaulted to `false`
# (so checking the box was required to stay in beta), while a plain
# `centinelo-v*` tag push has no `inputs.prerelease` at all - the
# "Publish the release" step's shell read that as an empty string, fell
# into its `else` branch, and shipped `--latest`. Same version, same
# code, different result depending on which button someone clicked - and
# `--latest` is exactly the failure mode this repo cannot afford while
# 2.0 has no Windows/Apple signing cert: it would silently displace
# v1.0.0 as the repo's public "Latest" download for every anonymous
# visitor, not just Edgar. Fixed by making BOTH paths default to
# prerelease=true unless a human explicitly opts out: the
# `workflow_dispatch` input's own default is now `true`, and the "Publish
# the release" step below treats a tag push (no input to read at all) the
# same way - `false` only reaches `--latest` when someone running
# `workflow_dispatch` deliberately unchecks the box. Taking 2.0 out of
# beta is still a one-input change, it's just opt-in instead of opt-out.
on:
  push:
    tags:
      - 'centinelo-v*'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version, bare SemVer, no leading 'v' (e.g. 2.1.0). The
          git tag centinelo-v<version> MUST already exist and be pushed -
          this input does not create a tag, it re-targets an existing one.
          Use this to re-run a release after fixing THIS workflow file
          itself (the workflow definition used is whatever ref you dispatch
          from - e.g. main once the fix is merged there - while the actual
          source built is always the tag's own commit, checked out
          explicitly below) without having to move/re-push the tag, the
          same problem .claude/skills/release-ci/SKILL.md's v1 lesson
          ("un tag corre el workflow DE SU COMMIT") describes for plain tag
          pushes.
        required: true
        type: string
      prerelease:
        description: >-
          Publish as a GitHub prerelease (not marked "Latest" - the
          repo-wide "Latest" slot is shared with v1.0.0's Electron line
          and, while 2.0 is beta, must never be silently taken over by a
          v2.x build with no OS-level signing cert). Default is `true`
          (safe): mark this run as prerelease UNLESS you explicitly
          uncheck it. Pass `false` only as a deliberate "take 2.0 out of
          beta" act - see the trigger-design comment at the top of this
          file for why both trigger paths (this input AND a plain
          `centinelo-v*` tag push) now default safe the same way.
        required: false
        type: boolean
        default: true

# Release builds are expensive (a full core + shell compile per platform)
# and their output is a public artifact - a superseded run must never be
# silently cancelled mid-upload the way a routine CI re-push should be.
# Group by the release identity (tag shape, normalized the same way for
# both trigger types) so two attempts at the SAME release queue instead of
# racing, but let each run to completion rather than cancelling it.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('centinelo-v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

# Least privilege by default (matches windows-installer.yml's own
# precedent): only the one job that actually creates the GitHub Release +
# uploads assets (publish-release, below) elevates to `contents: write`.
# Checkout/build/upload-artifact need no elevated scope at all - the
# default GITHUB_TOKEN is read-only, which is exactly what those jobs need.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Resolves the release version from whichever trigger fired, checks out
  # that exact tag, and refuses to go any further if either (a) the
  # updater's signing pubkey is still the known dev value, or (b) the real
  # signing secrets aren't configured. Cheap (ubuntu-latest, no compile) -
  # runs before the two expensive platform builds so a missing secret
  # fails in seconds, not after 60+ minutes of compiling core+shell twice.
  # -------------------------------------------------------------------
  preflight:
    name: Preflight (version, pubkey guard, secrets guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
      tag: ${{ steps.resolve-version.outputs.tag }}
    steps:
      - name: Resolve release version + tag from the trigger
        id: resolve-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          PUSHED_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RAW="$DISPATCH_VERSION"
          else
            # push of a `centinelo-v*` tag - PUSHED_REF_NAME is the tag's
            # own short name (e.g. "centinelo-v2.1.0"); strip the prefix.
            RAW="${PUSHED_REF_NAME#centinelo-v}"
          fi
          # Each numeric component is `(0|[1-9][0-9]*)`, not a plain
          # `[0-9]+` (2026-07-17, 4R reliability fix): SemVer's own spec
          # forbids leading zeros in major/minor/patch (e.g. "01.2.3" is
          # not a valid version), and a plain `[0-9]+` silently accepted
          # them - `scripts/set-release-version.sh` re-validates with this
          # exact same pattern (kept identical between the two on purpose,
          # see that script's own comment) so both reject the same inputs.
          if ! [[ "$RAW" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW' is not a valid SemVer version (expected X.Y.Z, no leading 'v'). Trigger was $EVENT_NAME, ref '$PUSHED_REF_NAME'." >&2
            exit 1
          fi
          {
            echo "version=$RAW"
            echo "tag=centinelo-v$RAW"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved release version=$RAW tag=centinelo-v$RAW"

      - name: Checkout the exact tagged commit
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.resolve-version.outputs.tag }}

      - name: Guard - refuse to release with the known DEV updater pubkey
        # shell/README.md "Dev signing key - replace before a real
        # release" documents this exact value as a well-known, non-secret
        # dev seed (its matching private half is regenerable from this
        # repo's own git history) - safe for development, unsafe the
        # moment a real release ships signed/verifiable under it, since
        # anyone could forge an update that every installed copy would
        # accept. This is a plain string compare, not a hash: the pubkey
        # itself is not a secret (it's meant to be public - "how every
        # installed copy verifies a signature"), so there is nothing to
        # gain from obscuring the known-bad value being compared against,
        # and a plain compare is directly auditable against the value
        # documented in shell/README.md.
        run: |
          set -euo pipefail
          DEV_PUBKEY='dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IENDNDk4N0VCQjc3N0RBRUIKUldUcjJuZTM2NGRKekpITkJNcjFDbUZQN25OcUxHZFY3aHFvODVSMWhTK1JDTHkrS0w3aVRCbUsK'
          CURRENT_PUBKEY="$(jq -r '.plugins.updater.pubkey' shell/src-tauri/tauri.conf.json)"
          if [[ "$CURRENT_PUBKEY" == "$DEV_PUBKEY" ]]; then
            echo "::error::tauri.conf.json still has the well-known DEV updater pubkey (plugins.updater.pubkey). Its matching private half is a known dev seed documented in shell/README.md 'Dev signing key - replace before a real release' - anyone can forge a signed update against it. Refusing to publish a release signed under this key." >&2
            echo "" >&2
            echo "Before a real release, Felix replaces this key OFFLINE (never in CI):" >&2
            echo "  1. npx tauri signer generate -w /somewhere/outside/any/repo/centinelo-updater.key" >&2
            echo "  2. Copy the printed PUBLIC key into tauri.conf.json's" >&2
            echo "     plugins.updater.pubkey (replacing the dev value) and commit that." >&2
            echo "  3. Store the PRIVATE key's content as this repo's TAURI_SIGNING_PRIVATE_KEY" >&2
            echo "     secret, and its password as TAURI_SIGNING_PRIVATE_KEY_PASSWORD." >&2
            echo "Full runbook: shell/README.md, section 'Dev signing key - replace before a real release'." >&2
            exit 1
          fi
          echo "OK: updater pubkey is not the known dev key."

      - name: Guard - release signing secrets must be configured
        # Never prints either secret's VALUE, only whether each is
        # missing, by NAME - matches this repo's "secrets never in
        # workflows/logs" rule while still giving Felix an actionable
        # error instead of a build that fails 90 minutes later inside
        # `tauri build` with a cryptic signing error.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          [[ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]] || missing+=(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Release signing secrets missing: ${missing[*]}. This pipeline refuses to build an unsigned release - tauri-plugin-updater can never verify an unsigned artifact on an installed copy (shell/README.md 'Contract for release-ci'). The private key lives OFFLINE with Felix (generated per shell/README.md's 'Dev signing key' runbook) and is added as a repo secret, never generated or stored by this workflow:" >&2
            echo "  Repo Settings -> Secrets and variables -> Actions -> New repository secret" >&2
            echo "    TAURI_SIGNING_PRIVATE_KEY           (the private key file's content)" >&2
            echo "    TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (the password chosen at generation)" >&2
            exit 1
          fi
          echo "OK: both signing secrets are configured (values never printed)."

  # -------------------------------------------------------------------
  # macOS (aarch64): builds core/ exactly like core-build.yml's macOS job
  # (same patches, same MODULES list, same OpenSSL discovery), then the
  # Tauri shell with createUpdaterArtifacts, then stages the core engine
  # binary into the built .app via package-official.sh (Community edition
  # - no premium dylib/console assets, this is the public repo only) the
  # same way F5's packaging pass already proved out. See the "Regenerate
  # the updater artifact" step below for the one real wrinkle this adds
  # on top of package-official.sh's existing, unmodified mac path.
  # -------------------------------------------------------------------
  build-macos:
    name: macOS (aarch64)
    needs: preflight
    runs-on: macos-14
    # core-build.yml's own macOS job (re + baresip + Tauri, same steps)
    # typically finishes in 20-30min - 90 gives ~3x margin for a cold
    # cache / noisy-neighbor runner without masking a genuinely hung build
    # for an hour-plus.
    timeout-minutes: 90
    steps:
      - name: Guard - Apple notarization secrets must be configured
        # Mirrors the signing-secrets guard in preflight: never prints any
        # secret's VALUE, only whether each is missing, by NAME. macOS code
        # signing + notarization are a hard release gate (Gatekeeper refuses
        # an unsigned/un-notarized .app/.dmg for anyone who downloads it), so
        # a missing APPLE_* secret fails THIS job in seconds here - before
        # the 20-30min macOS compile starts - instead of failing deep inside
        # codesign/notarytool. This guard lives in `build-macos` (moved out of
        # `preflight`) so it gates ONLY the macOS build, NOT the whole
        # pipeline: Windows needs no Apple signing at all (it signs its
        # updater with the same Ed25519 updater keypair the preflight guard
        # already checks, nothing Apple), so a tester can produce a Windows
        # installer with ONLY the updater keypair configured, before the
        # Apple Developer Program cert is obtained. publish-release still
        # refuses to publish a release that produced no platform assets, so a
        # half-signed release never ships.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${APPLE_CERTIFICATE:-}" ]] || missing+=(APPLE_CERTIFICATE)
          [[ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ]] || missing+=(APPLE_CERTIFICATE_PASSWORD)
          [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]] || missing+=(APPLE_SIGNING_IDENTITY)
          [[ -n "${APPLE_ID:-}" ]] || missing+=(APPLE_ID)
          [[ -n "${APPLE_PASSWORD:-}" ]] || missing+=(APPLE_PASSWORD)
          [[ -n "${APPLE_TEAM_ID:-}" ]] || missing+=(APPLE_TEAM_ID)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Apple notarization secrets missing: ${missing[*]}. Without a Developer ID Application certificate + notary credentials this pipeline cannot produce a macOS .app/.dmg Gatekeeper will open (codesign would fail, and notarytool cannot authenticate). Obtain the cert + app-specific password per the runbook and add these six repo secrets (values never printed here):" >&2
            echo "  Repo Settings -> Secrets and variables -> Actions -> New repository secret" >&2
            echo "    APPLE_CERTIFICATE           (Developer ID Application .p12, base64-encoded)" >&2
            echo "    APPLE_CERTIFICATE_PASSWORD  (the .p12 export password)" >&2
            echo "    APPLE_SIGNING_IDENTITY      ('Developer ID Application: Name (TEAMID)')" >&2
            echo "    APPLE_ID                    (the notarizing Apple ID email)" >&2
            echo "    APPLE_PASSWORD              (an app-specific password, NOT the account one)" >&2
            echo "    APPLE_TEAM_ID               (10-char Team ID)" >&2
            echo "Full runbook: shell/README.md, section 'Apple code signing & notarization - configure before a real macOS release'." >&2
            exit 1
          fi
          echo "OK: all Apple notarization secrets are configured (values never printed)."

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}
          submodules: recursive

      - name: Install toolchain
        run: brew install cmake openssl

      # --- core/: patches + build, mirrors core-build.yml's macOS job exactly ---

      - name: Apply local re patches
        run: |
          git apply --directory=core/deps/re core/patches/0001-re-configurable-sip-ws-path.patch
          git apply --directory=core/deps/re core/patches/0002-re-tls-fingerprint-pin.patch
          git apply --directory=core/deps/re core/patches/0004-re-json-stdout-purity.patch

      - name: Apply local baresip patches
        run: |
          git apply --directory=core/deps/baresip core/patches/0003-baresip-json-stdout-purity.patch
          git apply --directory=core/deps/baresip core/patches/0005-baresip-transfer-subscription-error-event.patch
          git apply --directory=core/deps/baresip core/patches/0006-baresip-msvc-arg-parsing.patch

      - name: Verify every core/patches/*.patch is applied in this job
        # Same trip-wire as core-build.yml's own macOS job (see that
        # file's comment for why this exists) - duplicated deliberately,
        # not shared, since each job's own `git apply` steps above are
        # this check's actual source of truth.
        run: |
          set -euo pipefail
          applied=$(printf '%s\n' \
            0001-re-configurable-sip-ws-path.patch \
            0002-re-tls-fingerprint-pin.patch \
            0003-baresip-json-stdout-purity.patch \
            0004-re-json-stdout-purity.patch \
            0005-baresip-transfer-subscription-error-event.patch \
            0006-baresip-msvc-arg-parsing.patch \
            | sort)
          available=$(cd core/patches && ls -1 *.patch | sort)
          if [ "$applied" != "$available" ]; then
            echo "error: core/patches/*.patch does not match the patches this job applies" >&2
            echo "--- available in core/patches/ ---" >&2
            echo "$available" >&2
            echo "--- applied by this job's git apply steps ---" >&2
            echo "$applied" >&2
            exit 1
          fi
          echo "OK: this job applies exactly the $(echo "$available" | wc -l | tr -d ' ') patch(es) in core/patches/"

      - name: Configure + build libre
        run: |
          cmake -S core/deps/re -B core/deps/re/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)"
          cmake --build core/deps/re/build -j"$(sysctl -n hw.ncpu)"

      - name: Configure + build baresip + ctrl_json
        run: |
          set -o pipefail
          cmake -S core/deps/baresip -B core/deps/baresip/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)" \
            -DMODULES="account;g711;auconv;auresamp;ausine;aufile;ice;dtls_srtp;menu;coreaudio" \
            -DAPP_MODULES="ctrl_json" \
            -DAPP_MODULES_DIR="${{ github.workspace }}/core/modules" \
            2>&1 | tee baresip-configure.log
          cmake --build core/deps/baresip/build -j"$(sysctl -n hw.ncpu)"

      - name: Sanity - binary + ctrl_json + coreaudio modules exist
        run: |
          set -euo pipefail
          test -x core/deps/baresip/build/baresip
          test -e core/deps/baresip/build/ctrl_json.so
          test -e core/deps/baresip/build/coreaudio.so
          core/deps/baresip/build/baresip -h 2>&1 | grep -q "Usage: baresip"
          detected_line="$(grep '^MODULES_DETECTED=' baresip-configure.log || true)"
          if [ -z "$detected_line" ]; then
            echo "error: MODULES_DETECTED line not found in baresip-configure.log" >&2
            exit 1
          fi
          detected_tokens=";${detected_line#MODULES_DETECTED=};"
          for mod in ausine aufile ice dtls_srtp coreaudio; do
            case "$detected_tokens" in
              *";$mod;"*) ;;
              *)
                echo "error: module '$mod' missing from MODULES_DETECTED" >&2
                exit 1
                ;;
            esac
          done
          echo "OK: re + baresip(+ctrl_json, +ausine, +aufile, +ice, +dtls_srtp, +coreaudio) built on macOS"

      # --- shell/: version stamp + Tauri build + core-engine injection ---

      - uses: actions/setup-node@v4
        with:
          # Matches shell-build.yml's own node-version - kept in lockstep
          # with that workflow rather than "whatever's current" so a Node
          # upgrade is a deliberate, repo-wide change, not a per-workflow
          # drift.
          node-version: 22

      - name: Install shell JS dependencies
        working-directory: shell
        run: npm ci

      - name: Stamp release version into tauri.conf.json / Cargo.toml / package.json
        run: bash scripts/set-release-version.sh "${{ needs.preflight.outputs.version }}"

      - name: cargo check (fast compile-time sanity)
        working-directory: shell/src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: shell/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build the Tauri .app (app only - .dmg rebuilt post-sign, see below)
        # `--bundles app` (NOT app,dmg): the .dmg is built LATER, from the
        # signed+stapled .app, because package-official.sh injects core-engine
        # into .app/Contents/MacOS/ AFTER this step - a .dmg built here would
        # wrap a core-engine-less .app and ship an incomplete, unrunnable app.
        # tauri.conf.json's bundle.macOS.signingIdentity is null on purpose,
        # so Tauri does NOT sign at this point and never races the manual
        # codesign step below (which has to run after the injection, since the
        # injection invalidates any build-time signature). The updater
        # .app.tar.gz + .sig that `--bundles app` still emits are regenerated
        # again later, from the signed .app - see that step's comment.
        working-directory: shell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles app

      - name: Stage core engine binary into the built .app (Community edition)
        # No --premium-dylib/--premium-sig/--premium-console-assets given -
        # package-official.sh's own documented, intentional "Community
        # edition" mode (see that script's usage() / step 2 comment): the
        # premium module is private-repo-only and never built here. Only
        # --skip-core-build (already built above, same job) and
        # --skip-shell-build (already built above too) are passed, so this
        # invocation does nothing but steps 5-8: locate the just-built
        # .app and copy the core engine binary + modules beside its
        # executable (Contents/MacOS/core-engine/).
        run: bash scripts/package-official.sh --target macos --skip-core-build --skip-shell-build

      - name: Import Apple Developer ID certificate into a temporary keychain
        # The .p12 (APPLE_CERTIFICATE, base64) is decoded and imported into a
        # throwaway keychain created for THIS run, prepended to the user
        # search list so codesign can resolve APPLE_SIGNING_IDENTITY, and
        # deleted in the final cleanup step (if: always()). The cert never
        # touches the runner's default/login keychain and never persists. No
        # secret value is printed - only a count of identities found.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC_PATH="$RUNNER_TEMP/notarization.keychain-db"
          KC_PW="$(uuidgen 2>/dev/null || openssl rand -hex 32)"
          rm -f "$KC_PATH"
          security create-keychain -p "$KC_PW" "$KC_PATH"
          # Keep it unlocked for the lifetime of this job - auto-lock would
          # make a later codesign prompt for the password and hang the run.
          # 21600s = 6h, comfortably past this job's timeout-minutes (90m),
          # so the keychain cannot relock mid-notarize.
          security set-keychain-settings -lut 21600 "$KC_PATH"
          security unlock-keychain -p "$KC_PW" "$KC_PATH"
          P12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          security import "$P12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC_PATH"
          # Prepend our keychain to the user search list so codesign finds the
          # identity without it living in the runner's default keychain.
          # shellcheck disable=SC2046  # word-splitting is intentional: each
          # existing keychain path must be passed as a separate argument.
          security list-keychains -d user -s "$KC_PATH" $(security list-keychains -d user | tr -d '"')
          # Let apple-tool:/codesign use the imported key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC_PATH"
          rm -f "$P12"
          echo "APPLE_KEYCHAIN_PATH=$KC_PATH" >> "$GITHUB_ENV"
          N="$(security find-identity -v -p codesigning "$KC_PATH" | grep -c 'Developer ID Application' || true)"
          [[ "$N" -ge 1 ]] || { echo "::error::Developer ID Application identity not found in the temporary keychain after import" >&2; exit 1; }
          echo "-- imported $N Developer ID Application identity(ies) into the temporary keychain"

      - name: Codesign the .app in depth (inner-to-outer, hardened runtime)
        # MANUAL signing, NOT Tauri's: package-official.sh injected core-engine
        # + modules into .app/Contents/MacOS/ AFTER `tauri build`, which
        # invalidates any build-time signature, so signing is the LAST
        # structural step. bundle.macOS.signingIdentity is null in
        # tauri.conf.json precisely so Tauri does NOT sign and race this step.
        # We sign inner-to-outer - Apple's supported replacement for the
        # deprecated `--deep` (which re-signs already-signed nested binaries
        # and corrupts their seals): every embedded Mach-O first, then the
        # .app bundle last. The same plist (entitlements.plist) is applied to
        # the main executable and the baresip sidecar.
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # First step that needs the just-built .app: define the bundle dir +
          # .app path ONCE here and export ABSOLUTE paths to $GITHUB_ENV for
          # every downstream step (notarytool, build-dmg, regenerate-updater,
          # verify, upload). Absolute paths are correct whether or not a step
          # sets working-directory (the regenerate step runs under
          # working-directory: shell and would otherwise need a shell/-less
          # relative path - the absolute path is identical either way).
          BUNDLE_DIR="$GITHUB_WORKSPACE/shell/src-tauri/target/release/bundle/macos"
          APP="$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.app' | head -n1)"
          [[ -n "$APP" ]] || { echo "error: no .app under $BUNDLE_DIR" >&2; exit 1; }
          echo "MACOS_BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"
          echo "MACOS_APP_PATH=$APP" >> "$GITHUB_ENV"
          ENT="$GITHUB_WORKSPACE/shell/src-tauri/entitlements.plist"
          [[ -f "$ENT" ]] || { echo "error: entitlements not found at $ENT" >&2; exit 1; }
          ID="$APPLE_SIGNING_IDENTITY"
          # 1) Embedded libraries (baresip .so modules + any premium .dylib):
          #    hardened runtime only - entitlements do not apply to libraries.
          find "$APP/Contents" -type f \( -name '*.so' -o -name '*.dylib' \) -print0 |
            while IFS= read -r -d '' lib; do
              echo "-- signing library: ${lib#"$APP/"}"
              codesign --force --options runtime --timestamp -s "$ID" "$lib"
            done
          # 2) The baresip core-engine sidecar is a STANDALONE process that
          #    opens the mic + a SIP socket itself, so under hardened runtime
          #    it needs the SAME audio-input/network entitlements as the main
          #    executable (entitlements are per-executable, NOT inherited by
          #    a child process). Sign every extensionless Mach-O under
          #    core-engine/ (file-type checked, so non-Mach-O data is skipped).
          find "$APP/Contents/MacOS/core-engine" -maxdepth 1 -type f ! -name '*.so' ! -name '*.dylib' -print0 |
            while IFS= read -r -d '' bin; do
              if file -b "$bin" | grep -q -i 'Mach-O'; then
                echo "-- signing executable: ${bin#"$APP/"}"
                codesign --force --options runtime --entitlements "$ENT" --timestamp -s "$ID" "$bin"
              fi
            done
          # 3) The .app bundle itself - signs its main executable and writes
          #    the bundle seal. Signed LAST so it seals the already-signed
          #    nested Mach-Os rather than overwriting them.
          echo "-- signing .app bundle: $(basename "$APP")"
          codesign --force --options runtime --entitlements "$ENT" --timestamp -s "$ID" "$APP"
          echo "OK: .app signed inner-to-outer (hardened runtime)"

      - name: Notarize + staple the .app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="${MACOS_APP_PATH:?MACOS_APP_PATH not exported by the codesign step}"
          ZIP="$RUNNER_TEMP/$(basename "$APP").zip"
          rm -f "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "-- submitting $(basename "$ZIP") to notarytool (--wait)"
          SUBMIT_LOG="$RUNNER_TEMP/notarytool-app-submit.log"
          # On rejection, surface the WHY: capture the submission-id notarytool
          # echoes and fetch its JSON log WITHOUT re-submitting. The old path
          # only left a bare non-zero exit code in the Actions log.
          if ! xcrun notarytool submit "$ZIP" \
                --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
                --wait 2>&1 | tee "$SUBMIT_LOG"; then
            SUBMISSION_ID="$(grep -m1 -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$SUBMIT_LOG" || true)"
            if [[ -n "${SUBMISSION_ID:-}" ]]; then
              echo "-- notarytool rejected $ZIP (id $SUBMISSION_ID); fetching the rejection log"
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
                || echo "(notarytool log fetch itself failed; submission-id was $SUBMISSION_ID)" >&2
            else
              echo "::error::notarytool submit failed and no submission-id could be parsed; see output above" >&2
            fi
            exit 1
          fi
          echo "-- stapling the .app"
          xcrun stapler staple "$APP"
          echo "OK: .app notarized + stapled"

      - name: Build, sign, notarize + staple the .dmg from the final signed .app
        # The .dmg is built NOW from the signed+stapled .app (NOT by `tauri
        # build`), because building it earlier would wrap a core-engine-less
        # .app. A .dmg is its OWN notarization target, separate from the .app
        # inside it, so it is signed + submitted + stapled independently.
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="${MACOS_BUNDLE_DIR:?MACOS_BUNDLE_DIR not exported by the codesign step - is it still the first step that touches the bundle?}"
          APP="${MACOS_APP_PATH:?MACOS_APP_PATH not exported by the codesign step}"
          APP_BASE="$(basename "$APP" .app)"
          STAGING="$RUNNER_TEMP/dmg-staging"
          rm -rf "$STAGING"; mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          DMG="$BUNDLE_DIR/${APP_BASE}_${VERSION}_aarch64.dmg"
          rm -f "$DMG"
          # UDZO (compressed, read-only) + HFS+ for broad notarytool/OS support.
          hdiutil create -volname "$APP_BASE" -srcfolder "$STAGING" \
            -fs HFS+ -format UDZO -imagekey zlib-level=9 "$DMG"
          echo "-- signing the .dmg"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG"
          echo "-- submitting $(basename "$DMG") to notarytool (--wait)"
          SUBMIT_LOG="$RUNNER_TEMP/notarytool-dmg-submit.log"
          if ! xcrun notarytool submit "$DMG" \
                --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
                --wait 2>&1 | tee "$SUBMIT_LOG"; then
            SUBMISSION_ID="$(grep -m1 -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$SUBMIT_LOG" || true)"
            if [[ -n "${SUBMISSION_ID:-}" ]]; then
              echo "-- notarytool rejected $DMG (id $SUBMISSION_ID); fetching the rejection log"
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
                || echo "(notarytool log fetch itself failed; submission-id was $SUBMISSION_ID)" >&2
            else
              echo "::error::notarytool submit failed and no submission-id could be parsed; see output above" >&2
            fi
            exit 1
          fi
          echo "-- stapling the .dmg"
          xcrun stapler staple "$DMG"
          echo "OK: .dmg built from signed .app, signed, notarized + stapled"

      - name: Regenerate the updater artifact (.app.tar.gz + .sig) after core-engine injection
        # `tauri build` above already produced a `.app.tar.gz` + `.sig`
        # pair as part of the SAME command that built the plain `.app` -
        # i.e. BEFORE the previous step copied the core engine binary +
        # modules into Contents/MacOS/. package-official.sh's macOS path
        # copies there (not through Tauri's own `bundle.resources`,
        # unlike the Windows job below) because that mechanism places
        # files under Contents/Resources/ on macOS, not beside the
        # executable the way centinelo-premium-abi::expected_library_path
        # and this app's own sidecar.rs both require - so a manual
        # post-build copy is the only way to get "beside the executable"
        # on macOS, and there is no earlier point in the build to inject
        # it instead. Whether that ordering makes the FIRST .app.tar.gz
        # genuinely stale (missing the core engine) was not confirmed by
        # reading tauri-bundler's own source this pass (unlike this
        # repo's usual "read the source, don't infer" bar - see
        # shell/README.md's own citations for that standard) - so this
        # step does not depend on the answer either way: it always
        # re-tars the NOW-core-engine-complete .app and re-signs it with
        # `tauri signer sign`, the exact public CLI `tauri build` uses
        # internally, against the same signing secrets. Cheap (seconds)
        # and idempotent, so "maybe unnecessary" costs nothing next to
        # "maybe ships an updater artifact silently missing the engine".
        working-directory: shell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="${MACOS_BUNDLE_DIR:?MACOS_BUNDLE_DIR not exported by the codesign step - is it still the first step that touches the bundle?}"
          APP_DIR="${MACOS_APP_PATH:?MACOS_APP_PATH not exported by the codesign step}"
          [[ -d "$APP_DIR" ]] || { echo "error: no .app bundle found under $BUNDLE_DIR" >&2; exit 1; }
          TARBALL="$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.app.tar.gz' | head -n1)"
          [[ -n "$TARBALL" ]] || { echo "error: no .app.tar.gz found under $BUNDLE_DIR (createUpdaterArtifacts should have produced one at build time)" >&2; exit 1; }
          echo "-- re-tarring $(basename "$APP_DIR") -> $(basename "$TARBALL") (post core-engine injection)"
          # COPYFILE_DISABLE=1 keeps macOS bsdtar from writing `._` AppleDouble
          # sidecars (extended-attribute carriers) into the archive, matching the
          # metadata-free tar that tauri-bundler's Rust `tar` crate produces at
          # build time and that tauri-plugin-updater expects to extract - so the
          # .app.tar.gz stays in the exact format the updater knows how to untar.
          COPYFILE_DISABLE=1 tar -czf "$TARBALL" -C "$BUNDLE_DIR" "$(basename "$APP_DIR")"
          rm -f "$TARBALL.sig"
          npx tauri signer sign -f "$TARBALL"
          [[ -f "$TARBALL.sig" ]] || { echo "error: tauri signer sign did not produce $TARBALL.sig" >&2; exit 1; }
          # The auto-updater downloads THIS tarball and REPLACES the installed
          # .app with its contents, so the Developer ID signature + notarization
          # staple must survive the tar/untar round-trip. The standalone "Verify"
          # step below only checks the LOOSE .app/.dmg - it never re-checks what
          # the updater actually ships. So extract to a temp dir and re-run the
          # same checks here: a hardened-runtime binary whose seal did not
          # survive re-tar is rejected by the kernel and would not launch after
          # the update - we must catch that before publishing, not in the field.
          echo "-- verifying signature + staple survive the tar round-trip"
          VERIFY_DIR="$(mktemp -d)"
          tar -xzf "$TARBALL" -C "$VERIFY_DIR"
          EXTRACTED_APP="$(find "$VERIFY_DIR" -maxdepth 1 -name '*.app' | head -n1)"
          [[ -n "$EXTRACTED_APP" ]] || { echo "error: extracted updater tarball contained no .app" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$EXTRACTED_APP" || {
            echo "::error::codesign verify FAILED on the .app extracted from the regenerated updater tarball - the Developer ID signature did NOT survive the tar/untar round-trip; refusing to publish an updater artifact the auto-updater would install and the kernel would reject." >&2
            exit 1
          }
          xcrun stapler validate "$EXTRACTED_APP" || {
            echo "::error::stapler validate FAILED on the .app extracted from the regenerated updater tarball - the notarization ticket did NOT survive the tar/untar round-trip." >&2
            exit 1
          }
          rm -rf "$VERIFY_DIR"
          echo "OK: regenerated $(basename "$TARBALL") + .sig; signature + staple survived the re-tar round-trip"

      - name: Verify codesign, Gatekeeper, and notarization staple
        # Last gate before upload. codesign --verify --deep is the SUPPORTED
        # use of --deep (only `codesign --sign --deep` is deprecated);
        # spctl assesses Gatekeeper's verdict on the notarized app; stapler
        # validate confirms the notarization ticket is attached to BOTH the
        # .app and the .dmg. A failure here blocks the upload below.
        run: |
          set -euo pipefail
          BUNDLE_DIR="${MACOS_BUNDLE_DIR:?MACOS_BUNDLE_DIR not exported by the codesign step - is it still the first step that touches the bundle?}"
          APP="${MACOS_APP_PATH:?MACOS_APP_PATH not exported by the codesign step}"
          DMG="$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.dmg' | head -n1)"
          for f in "$APP" "$DMG"; do
            [[ -n "$f" ]] || { echo "error: missing expected bundle under $BUNDLE_DIR ($f)" >&2; exit 1; }
          done
          echo "-- codesign --verify --deep --strict --verbose=2 on the .app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "-- spctl Gatekeeper assessment of the .app"
          spctl -a -t exec -vv "$APP"
          echo "-- stapler validate on .app and .dmg"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          echo "OK: codesign + Gatekeeper + notarization staple all verified"

      - name: Verify bundle artifacts before upload
        run: |
          set -euo pipefail
          BUNDLE_DIR="${MACOS_BUNDLE_DIR:?MACOS_BUNDLE_DIR not exported by the codesign step - is it still the first step that touches the bundle?}"
          for pattern in '*.dmg' '*.app.tar.gz' '*.app.tar.gz.sig'; do
            count=0
            while IFS= read -r -d '' f; do
              [[ -s "$f" ]] || { echo "error: $f exists but is zero bytes" >&2; exit 1; }
              count=$((count + 1))
            done < <(find "$BUNDLE_DIR" -maxdepth 1 -name "$pattern" -print0)
            if [[ "$count" -eq 0 ]]; then
              echo "error: no file matching $pattern in $BUNDLE_DIR - refusing to upload" >&2
              exit 1
            fi
          done
          echo "OK: dmg + app.tar.gz + app.tar.gz.sig all present and non-empty"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: |
            shell/src-tauri/target/release/bundle/macos/*.dmg
            shell/src-tauri/target/release/bundle/macos/*.app.tar.gz
            shell/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          # These artifacts only ever exist to hand off to publish-release
          # within THIS SAME workflow run - once published, the real,
          # permanent copies live as GitHub Release assets. 5 days is just
          # enough slack to re-run publish-release alone (workflow_dispatch
          # re-run of a failed run) without recompiling, not a retention
          # policy for the artifacts themselves.
          retention-days: 5

      - name: Cleanup temporary signing keychain
        # `if: always()` so the cert's private key is removed even when a later
        # step failed. Deletes the keychain this run created; a no-op (with a
        # log line) if the import step never created one. The cert never
        # persists on the runner either way.
        if: always()
        run: |
          set -u
          KC_PATH="${APPLE_KEYCHAIN_PATH:-$RUNNER_TEMP/notarization.keychain-db}"
          if [[ -n "${KC_PATH:-}" ]] && security show-keychain-info "$KC_PATH" >/dev/null 2>&1; then
            security delete-keychain "$KC_PATH" 2>/dev/null || true
            echo "-- deleted temporary keychain $KC_PATH"
          else
            echo "-- no temporary keychain to delete"
          fi

  # -------------------------------------------------------------------
  # Windows (x86_64): builds core/ exactly like core-build.yml's Windows
  # job (same re-install-prefix dance, same MODULES list including
  # wasapi, same OpenSSL choco discovery), then delegates the ENTIRE
  # staging + NSIS/MSI build to package-official.sh --target windows -
  # unlike macOS, that script's Windows path already stages core-engine +
  # OpenSSL DLLs into shell/dist-injected/ BEFORE calling `tauri build`
  # (Tauri's own `bundle.resources` manifest mechanism, proven by
  # windows-installer.yml's own resources-mechanism-smoke-test job), so
  # the NSIS .exe + its .sig that come out are already correct - no
  # re-tar/re-sign wrinkle needed here the way macOS has above.
  #
  # NOTE: core-build steps intentionally duplicated across mac/windows jobs
  # (reusable-workflow refactor deferred) - patch-apply / cmake configure /
  # sanity-check steps mirror build-macos above almost line for line. A
  # composite or reusable workflow could collapse the shared parts, but
  # that's a refactor of an already-verified pipeline for a readability
  # gain, not a correctness one - deferred rather than done as part of this
  # 4R pass (2026-07-17).
  # -------------------------------------------------------------------
  build-windows:
    name: Windows (x86_64)
    needs: preflight
    runs-on: windows-latest
    # Windows builds (choco OpenSSL install + MSVC re/baresip compile +
    # Tauri NSIS/MSI bundling) run noticeably slower than the macOS job's
    # equivalent steps on GitHub-hosted runners - core-build.yml's own
    # Windows job (same core/ build) already needs more headroom than its
    # macOS counterpart, and this job adds the Tauri/NSIS/MSI stage on top.
    timeout-minutes: 120
    env:
      # Opus (codecs sprint, v1.6) has no Chocolatey package (verified via
      # `choco search opus` - see core/BUILD.md "Codecs (Opus)") and
      # FindOPUS.cmake skips pkg-config entirely on WIN32, so vcpkg is the
      # only real path to a Windows opus.h/opus.lib. Pinned to a specific
      # vcpkg tag (not `master`) so a future upstream vcpkg change can't
      # silently swap the opus version this release build links against
      # without a deliberate bump here - reproducibility for a release
      # pipeline, not just convenience.
      VCPKG_REF: "2026.07.29"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}
          submodules: recursive

      - name: Install OpenSSL (Chocolatey)
        run: choco install openssl -y --no-progress

      - name: Cache vcpkg (opus)
        # Caches the cloned+bootstrapped vcpkg tree AND its installed/
        # output (opus.lib + opus.h) together, keyed on the pinned vcpkg
        # tag + triplet + opus port version. A cache hit skips the clone/
        # bootstrap/compile-from-source entirely - opus itself is small,
        # but vcpkg's own bootstrap (fetching its bundled CMake/ninja) and
        # git-cloning the ports registry is not, and paying that on every
        # release run for a dependency that changes rarely would be pure
        # waste. `opus-port-v1` is a manual cache-buster suffix: bump it
        # if this job's opus triplet/build flags ever change without the
        # VCPKG_REF pin also changing.
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-opus-x64-windows-static-md-${{ env.VCPKG_REF }}-opus-port-v1

      - name: Bootstrap vcpkg + install opus (skipped on cache hit)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:VCPKG_REF https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          # x64-windows-static-md (a built-in vcpkg triplet, not a
          # community one - confirmed present in the pinned vcpkg tag):
          # STATIC opus.lib linked against the DYNAMIC (/MD) MSVC CRT,
          # matching this job's existing Release/MSVC default CRT choice
          # (no CMAKE_MSVC_RUNTIME_LIBRARY override anywhere in this
          # workflow). Deliberately NOT the default x64-windows triplet,
          # which builds a SHARED opus.dll: baresip.exe already needs the
          # choco OpenSSL DLLs staged beside it (see "Verify installer +
          # updater artifacts" step below), and every additional runtime
          # DLL is one more way the installer can produce an .exe that
          # launches fine on this runner and then fails to start on the
          # end user's machine if packaging ever misses it. Static opus
          # removes that failure mode entirely for this one codec: it
          # rides inside baresip.exe with no DLL to stage or forget.
          .\vcpkg\vcpkg.exe install opus:x64-windows-static-md

      - name: Verify vcpkg opus install (fail fast, cache-hit or not)
        shell: bash
        run: |
          set -euo pipefail
          test -f vcpkg/installed/x64-windows-static-md/lib/opus.lib
          test -f vcpkg/installed/x64-windows-static-md/include/opus/opus.h
          echo "OK: opus.lib + opus.h present under vcpkg/installed/x64-windows-static-md"

      - name: Locate OpenSSL install dir (choco deploy path varies by pkg version)
        # Identical to core-build.yml's Windows job - see that file's own
        # comment on this step for the v3-vs-v4 Chocolatey path rationale.
        shell: pwsh
        run: |
          $candidates = @('C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64')
          $root = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $root) {
            Write-Error "OpenSSL headers (include/openssl/ssl.h) not found under: $($candidates -join ', ')"
            exit 1
          }
          "OPENSSL_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "OPENSSL_ROOT_DIR=$root"

      - name: Apply local re patches
        shell: bash
        run: |
          git apply --directory=core/deps/re core/patches/0001-re-configurable-sip-ws-path.patch
          git apply --directory=core/deps/re core/patches/0002-re-tls-fingerprint-pin.patch
          git apply --directory=core/deps/re core/patches/0004-re-json-stdout-purity.patch

      - name: Apply local baresip patches
        shell: bash
        run: |
          git apply --directory=core/deps/baresip core/patches/0003-baresip-json-stdout-purity.patch
          git apply --directory=core/deps/baresip core/patches/0005-baresip-transfer-subscription-error-event.patch
          git apply --directory=core/deps/baresip core/patches/0006-baresip-msvc-arg-parsing.patch

      - name: Verify every core/patches/*.patch is applied in this job
        shell: bash
        run: |
          set -euo pipefail
          applied=$(printf '%s\n' \
            0001-re-configurable-sip-ws-path.patch \
            0002-re-tls-fingerprint-pin.patch \
            0003-baresip-json-stdout-purity.patch \
            0004-re-json-stdout-purity.patch \
            0005-baresip-transfer-subscription-error-event.patch \
            0006-baresip-msvc-arg-parsing.patch \
            | sort)
          available=$(cd core/patches && ls -1 *.patch | sort)
          if [ "$applied" != "$available" ]; then
            echo "error: core/patches/*.patch does not match the patches this job applies" >&2
            echo "--- available in core/patches/ ---" >&2
            echo "$available" >&2
            echo "--- applied by this job's git apply steps ---" >&2
            echo "$applied" >&2
            exit 1
          fi
          echo "OK: this job applies exactly the $(echo "$available" | wc -l | tr -d ' ') patch(es) in core/patches/"

      - name: Configure + build + install libre
        # Identical to core-build.yml's Windows job - static-only build,
        # installed to flatten MSVC's multi-config Release/ subdir. See
        # that file's own comment for why.
        shell: bash
        run: |
          set -o pipefail
          RE_INSTALL="$(pwd -W)/re-install-prefix"
          cmake -S core/deps/re -B core/deps/re/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RE_INSTALL" \
            -DLIBRE_BUILD_SHARED=OFF \
            -DLIBRE_BUILD_STATIC=ON \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            2>&1 | tee re-configure.log
          cmake --build core/deps/re/build --config Release 2>&1 | tee -a re-configure.log
          cmake --install core/deps/re/build --config Release 2>&1 | tee -a re-configure.log

      - name: Configure + build baresip + ctrl_json
        shell: bash
        run: |
          set -o pipefail
          RE_INSTALL="$(pwd -W)/re-install-prefix"
          cmake -S core/deps/baresip -B core/deps/baresip/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DRE_LIBRARY="$RE_INSTALL/lib/re-static.lib" \
            -DRE_INCLUDE_DIR="$(pwd -W)/core/deps/re/include" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DOPUS_HINTS="$(pwd -W)/vcpkg/installed/x64-windows-static-md" \
            -DMODULES="account;g711;opus;auconv;auresamp;ausine;aufile;ice;dtls_srtp;menu;wasapi" \
            -DAPP_MODULES="ctrl_json" \
            -DAPP_MODULES_DIR="$(pwd -W)/core/modules" \
            2>&1 | tee baresip-configure.log
          cmake --build core/deps/baresip/build --config Release 2>&1 | tee -a baresip-configure.log

      - name: Sanity - baresip + ctrl_json built
        shell: bash
        run: |
          RE_INSTALL="$(pwd -W)/re-install-prefix"
          test -x core/deps/baresip/build/Release/baresip.exe
          test -f "$RE_INSTALL/lib/re-static.lib"
          detected_line="$(grep '^MODULES_DETECTED=' baresip-configure.log || true)"
          if [ -z "$detected_line" ]; then
            echo "error: MODULES_DETECTED line not found in baresip-configure.log" >&2
            exit 1
          fi
          detected_tokens=";${detected_line#MODULES_DETECTED=};"
          for mod in ausine aufile ice dtls_srtp wasapi opus; do
            case "$detected_tokens" in
              *";$mod;"*) ;;
              *)
                echo "error: module '$mod' missing from MODULES_DETECTED" >&2
                exit 1
                ;;
            esac
          done
          echo "OK: re + baresip(+ctrl_json, +ausine, +aufile, +ice, +dtls_srtp, +wasapi, +opus) built on Windows"

      - uses: actions/setup-node@v4
        with:
          # Kept identical to the macOS job's own node-version above and to
          # shell-build.yml's - see that step's comment.
          node-version: 22

      - name: Stamp release version into tauri.conf.json / Cargo.toml / package.json
        shell: bash
        run: bash scripts/set-release-version.sh "${{ needs.preflight.outputs.version }}"

      - name: Locate VCRUNTIME140_THREADS.dll (MSVC runtime, app-local deploy)
        # Closes the incident diagnosed 2026-08-13 on a remote clinic
        # employee's Windows machine: baresip.exe (built with this same
        # MSVC toolset) died with STATUS_DLL_NOT_FOUND (0xC0000135) before
        # main() ever ran, because VCRUNTIME140_THREADS.DLL - split out of
        # vcruntime140.dll starting with MSVC 14.40 / VS 2022 17.10 - is
        # NOT one of the DLLs plain Windows ships in System32, and that
        # machine had no VC++ Redistributable installed at all. See
        # scripts/package-official.sh's "2c. Validate VC++ Redistributable
        # DLL dir" comment for the full incident writeup and the licensing
        # rationale for shipping it app-local instead of requiring the end
        # user to install anything.
        #
        # windows-latest runners carry vswhere.exe at this fixed path (part
        # of the Visual Studio Installer, present on every GitHub-hosted
        # Windows image) - used here instead of hardcoding a VS version/
        # edition/install path, all three of which are runner-image details
        # that can change under us. The DLL itself is copied straight out
        # of the SAME Visual Studio installation whose MSVC toolset just
        # built baresip.exe above (not a separately-pinned download), so it
        # can never drift from the compiler that produced the .exe it rides
        # beside - a newer MSVC on a future runner image ships this file's
        # newer version automatically, with no version to bump here.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found at $vswhere - cannot locate the installed Visual Studio to find the VC++ runtime redistributable on this runner"
            exit 1
          }
          $installPath = & $vswhere -latest -products * -property installationPath
          if (-not $installPath) {
            Write-Error "vswhere.exe found no Visual Studio installation on this runner"
            exit 1
          }
          Write-Host "Visual Studio installationPath: $installPath"
          $dll = Get-ChildItem -Path $installPath -Recurse -Filter "vcruntime140_threads.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) {
            Write-Error "vcruntime140_threads.dll not found anywhere under $installPath - this runner's MSVC toolset predates VS 2022 17.10 / MSVC 14.40 and does not carry it. baresip.exe would fail to start on a clean end-user machine with STATUS_DLL_NOT_FOUND (0xC0000135) - see scripts/package-official.sh's '2c. Validate VC++ Redistributable DLL dir' comment for the incident this guards against. This must be fixed (e.g. update the runner image / MSVC toolset) before this job can produce a safe installer - refusing to silently ship a build missing this DLL."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "vcredist-dlls" | Out-Null
          Copy-Item $dll.FullName "vcredist-dlls\"
          Write-Host "OK: found $($dll.FullName) -> staged to vcredist-dlls\"

      - name: Package official Windows installer (core + OpenSSL + VC++ redist DLLs, Community edition)
        # package-official.sh's own Windows path does everything from here:
        # stages the just-built baresip.exe + OpenSSL runtime DLLs + the
        # VCRUNTIME140_THREADS.DLL located above into
        # shell/dist-injected/core-engine/, generates a filtered
        # tauri.official.generated.json (no premium entries - Community
        # edition, same as the macOS job above), then runs
        # `tauri build --config ... --bundles nsis,msi` itself. No
        # --premium-* flags given, matching the macOS job.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # $OPENSSL_ROOT_DIR is a WINDOWS path (e.g. "C:\Program Files\OpenSSL"),
          # set by the pwsh "Locate OpenSSL install dir" step above. That is correct
          # for the CMake/MSVC build steps (-DOPENSSL_ROOT_DIR=), which want a Windows
          # path, but FATAL here: package-official.sh runs in git-bash, which treats
          # "C:\..." as relative and prepends the workspace dir, producing
          # "/d/a/.../C:\Program Files\OpenSSL/bin". cygpath -u converts it to a Unix
          # path so the bash script resolves the absolute dir. See windows-installer.yml
          # which already passes a Unix path ("$PWD/fake-openssl-dlls") to this script.
          OPENSSL_DLL_DIR="$(cygpath -u "$OPENSSL_ROOT_DIR")/bin"
          # "vcredist-dlls" (created by the pwsh step above) is already a plain
          # workspace-relative path, not a "C:\..." Windows path, so - unlike
          # OPENSSL_DLL_DIR above - it needs no cygpath conversion here.
          bash scripts/package-official.sh --target windows --skip-core-build \
            --openssl-dll-dir "$OPENSSL_DLL_DIR" \
            --vcredist-dll-dir "$PWD/vcredist-dlls"

      - name: Verify installer + updater artifacts before upload
        shell: pwsh
        run: |
          $nsisExe = Get-ChildItem "shell\src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsisSig = Get-ChildItem "shell\src-tauri\target\release\bundle\nsis\*.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi = Get-ChildItem "shell\src-tauri\target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsisExe) { Write-Error "no NSIS .exe under bundle/nsis/ - refusing to upload"; exit 1 }
          if (-not $nsisSig) { Write-Error "no NSIS .exe.sig under bundle/nsis/ - the updater artifact is unsigned, refusing to upload"; exit 1 }
          if (-not $msi) { Write-Error "no .msi under bundle/msi/ - refusing to upload"; exit 1 }
          foreach ($f in @($nsisExe, $nsisSig, $msi)) {
            if ($f.Length -eq 0) { Write-Error "$($f.FullName) exists but is zero bytes"; exit 1 }
          }
          Write-Host "OK: NSIS .exe + .sig + MSI all present and non-empty"

          # Extract the MSI (admin install, no real install) and prove the
          # core engine + OpenSSL DLLs actually rode into it beside each
          # other - same check windows-installer.yml's own smoke-test job
          # already runs against SYNTHETIC fixtures; this is the first
          # time it runs against a REAL core-win build + real Chocolatey
          # OpenSSL DLLs.
          $extractDir = "$PWD\msi-extracted"
          $p = Start-Process -FilePath "msiexec.exe" -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$extractDir`"") -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "msiexec /a exited with code $($p.ExitCode)"; exit 1 }

          $baresipExe = Get-ChildItem -Recurse "$extractDir" -Filter "baresip.exe" | Select-Object -First 1
          if (-not $baresipExe) { Write-Error "baresip.exe not found in extracted MSI"; exit 1 }
          $libssl = Get-ChildItem -Recurse "$extractDir" -Filter "libssl-*.dll" | Select-Object -First 1
          $libcrypto = Get-ChildItem -Recurse "$extractDir" -Filter "libcrypto-*.dll" | Select-Object -First 1
          if (-not $libssl) { Write-Error "no libssl-*.dll found in extracted MSI - core.exe would fail to start on a clean machine"; exit 1 }
          if (-not $libcrypto) { Write-Error "no libcrypto-*.dll found in extracted MSI - core.exe would fail to start on a clean machine"; exit 1 }
          if ($baresipExe.DirectoryName -ne $libssl.DirectoryName -or $baresipExe.DirectoryName -ne $libcrypto.DirectoryName) {
            Write-Error "OpenSSL DLLs are NOT beside baresip.exe: baresip.exe in $($baresipExe.DirectoryName), libssl in $($libssl.DirectoryName), libcrypto in $($libcrypto.DirectoryName)"
            exit 1
          }
          Write-Host "OK: baresip.exe + libssl-*.dll + libcrypto-*.dll all beside each other at $($baresipExe.DirectoryName)"

          # VCRUNTIME140_THREADS.DLL (codecs sprint follow-up, 2026-08-13):
          # regression guard for the incident this pass fixes - see
          # scripts/package-official.sh's "2c. Validate VC++ Redistributable
          # DLL dir" comment. baresip.exe is built with an MSVC toolset that
          # requires this DLL and Windows itself does NOT ship it (unlike
          # plain vcruntime140.dll) - without it beside baresip.exe, the
          # process dies with STATUS_DLL_NOT_FOUND before main() ever runs,
          # silently: no stdout, no stderr, no app log, no Event Log entry.
          $vcruntimeThreads = Get-ChildItem -Recurse "$extractDir" -Filter "vcruntime140_threads.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vcruntimeThreads) { Write-Error "no vcruntime140_threads.dll found in extracted MSI - core.exe would fail to start on a clean machine with STATUS_DLL_NOT_FOUND (0xC0000135), with NO stdout/stderr/log trace (this is the exact incident diagnosed 2026-08-13 on a remote clinic employee's machine)"; exit 1 }
          if ($baresipExe.DirectoryName -ne $vcruntimeThreads.DirectoryName) {
            Write-Error "vcruntime140_threads.dll is NOT beside baresip.exe: baresip.exe in $($baresipExe.DirectoryName), vcruntime140_threads.dll in $($vcruntimeThreads.DirectoryName)"
            exit 1
          }
          Write-Host "OK: vcruntime140_threads.dll is beside baresip.exe at $($vcruntimeThreads.DirectoryName)"

          $premiumDll = Get-ChildItem -Recurse "$extractDir" -Filter "centinelo_premium.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($premiumDll) { Write-Error "Community edition build shipped centinelo_premium.dll - the resources filter leaked a premium artifact into a public-repo release"; exit 1 }
          Write-Host "OK: Community edition correctly ships no centinelo_premium.dll"

          # Opus (codecs sprint, v1.6) is built via vcpkg's x64-windows-static-md
          # triplet specifically so it links STATICALLY into baresip.exe - no
          # opus.dll should exist anywhere. This is a regression guard: if a
          # future edit ever swaps the triplet back to the default (dynamic)
          # x64-windows, this catches the missing-DLL-on-the-end-user's-machine
          # failure mode at CI time instead of after Felix's remote-work
          # install this week.
          $opusDll = Get-ChildItem -Recurse "$extractDir" -Filter "opus*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($opusDll) { Write-Error "Found $($opusDll.Name) in the extracted MSI - opus should be statically linked (x64-windows-static-md), not shipped as a DLL"; exit 1 }
          Write-Host "OK: opus is statically linked - no opus*.dll in the installer"

      - name: Verify baresip.exe import-table dependencies are all satisfied
        # Extra safety net beyond the specific libssl/libcrypto/
        # vcruntime140_threads checks above: this parses the REAL PE import
        # table of the packaged baresip.exe - not its strings, which
        # false-positive on the ~70 statically-linked baresip/re modules
        # and is exactly what let the VCRUNTIME140_THREADS.DLL gap through
        # three earlier debugging sessions on the affected machine before
        # someone inspected the import table directly - and asserts every
        # imported DLL is either (a) shipped beside baresip.exe in this
        # same installer, or (b) a DLL Windows itself guarantees on every
        # supported release (the allowlist below, plus the api-ms-win-*/
        # ext-ms-* apiset forwarders the OS loader resolves natively with
        # no physical file needed). A future dependency this build doesn't
        # yet know to ship - a new codec, a new baresip module - now turns
        # into a red CI check here instead of a silent STATUS_DLL_NOT_FOUND
        # on a clinic employee's machine with zero diagnostic trace.
        #
        # Uses dumpbin.exe from the SAME MSVC toolset that just built this
        # binary (located via vswhere.exe, same approach as the
        # VCRUNTIME140_THREADS.dll step above) rather than a hand-rolled PE
        # parser - dumpbin /dependents is the tool Microsoft's own docs
        # point to for this exact question ("Determine which DLLs to
        # redistribute").
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Error "vswhere.exe not found - cannot locate dumpbin.exe"; exit 1 }
          $installPath = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -Path "$installPath\VC\Tools\MSVC" -Recurse -Filter "dumpbin.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*Hostx64\x64*" } | Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin.exe not found under $installPath\VC\Tools\MSVC (Hostx64\x64) - cannot verify baresip.exe's import table"; exit 1 }
          Write-Host "Using dumpbin: $($dumpbin.FullName)"

          # Same extracted-MSI directory the earlier "Verify installer +
          # updater artifacts before upload" step in this job already
          # populated via msiexec /a - steps in the same job share the
          # filesystem (not shell variables), so this just re-resolves the
          # same on-disk path rather than re-extracting.
          $extractDir = "$PWD\msi-extracted"
          $baresipExe = Get-ChildItem -Recurse "$extractDir" -Filter "baresip.exe" | Select-Object -First 1
          if (-not $baresipExe) { Write-Error "baresip.exe not found in $extractDir - did the earlier extraction step run?"; exit 1 }

          $dumpOutput = & $dumpbin.FullName /dependents $baresipExe.FullName
          $inBlock = $false
          $imports = @()
          foreach ($line in $dumpOutput) {
            if ($line -match "has the following dependencies") { $inBlock = $true; continue }
            if ($inBlock) {
              $trimmed = $line.Trim()
              if ($trimmed -eq "") { break }
              $imports += $trimmed
            }
          }
          if ($imports.Count -eq 0) { Write-Error "dumpbin /dependents produced no import list for $($baresipExe.FullName) - dumpbin output format may have changed"; exit 1 }
          Write-Host "== baresip.exe imports ($($imports.Count)) =="
          $imports | ForEach-Object { Write-Host "  $_" }

          # DLLs Windows itself guarantees present on every currently
          # supported release (matches this codebase's own known-import
          # list: qwave/IPHLPAPI/WSOCK32/WS2_32/ole32/KERNEL32/SHELL32 plus
          # the other common Win32/CRT surface baresip+re+OpenSSL touch).
          # VCRUNTIME140.DLL itself is in this list on purpose - unlike its
          # "_threads" sibling, plain vcruntime140.dll DOES ship in
          # System32 (confirmed in this incident's own diagnosis, see
          # scripts/package-official.sh's "2c." comment) - only
          # VCRUNTIME140_THREADS.DLL needed the app-local fix.
          $systemDlls = @(
            "kernel32.dll","user32.dll","advapi32.dll","ws2_32.dll","wsock32.dll",
            "shell32.dll","ole32.dll","oleaut32.dll","iphlpapi.dll","qwave.dll",
            "ntdll.dll","rpcrt4.dll","crypt32.dll","winmm.dll","gdi32.dll",
            "msvcrt.dll","vcruntime140.dll","ucrtbase.dll","netapi32.dll",
            "userenv.dll","setupapi.dll","wintrust.dll","imm32.dll","bcrypt.dll",
            "secur32.dll","dbghelp.dll","version.dll","cfgmgr32.dll","psapi.dll"
          )
          $shippedDlls = Get-ChildItem -Recurse "$extractDir" -Filter "*.dll" | ForEach-Object { $_.Name.ToLowerInvariant() }
          $shippedDlls += $baresipExe.Name.ToLowerInvariant()

          $unsatisfied = @()
          foreach ($imp in $imports) {
            $impLower = $imp.ToLowerInvariant()
            if ($impLower -match '^(api-ms-win-|ext-ms-)') { continue }
            if ($systemDlls -contains $impLower) { continue }
            if ($shippedDlls -contains $impLower) { continue }
            $unsatisfied += $imp
          }

          if ($unsatisfied.Count -gt 0) {
            Write-Error "baresip.exe imports DLL(s) that are neither shipped in this installer nor on the known-in-box-Windows allowlist: $($unsatisfied -join ', '). This is exactly the failure mode that caused the 2026-08-13 STATUS_DLL_NOT_FOUND incident (VCRUNTIME140_THREADS.DLL) - either ship the missing DLL(s) via package-official.sh, or add them to this step's `$systemDlls` allowlist ONLY if they are genuinely guaranteed present on every supported Windows release (verify before adding, don't assume)."
            exit 1
          }
          Write-Host "OK: every baresip.exe import is either shipped in this installer or guaranteed present by Windows itself ($($imports.Count) imports checked)"

      - name: Stage Windows release assets flat
        # upload-artifact@v4 preserves the common-ancestor directory
        # structure of the given paths. These three files come from
        # bundle/nsis/ and bundle/msi/, so the artifact would ship them
        # nested under nsis/ and msi/ - but publish-release expects a FLAT
        # layout (dist/windows/*.exe etc.), exactly like the macOS job,
        # whose assets all live in a single bundle dir and are therefore
        # already flat. Copy them into one flat dir before uploading so the
        # downloaded artifact is flat and publish-release's globs/finds match.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/windows-assets
          cp shell/src-tauri/target/release/bundle/nsis/*.exe     dist/windows-assets/
          cp shell/src-tauri/target/release/bundle/nsis/*.exe.sig dist/windows-assets/
          cp shell/src-tauri/target/release/bundle/msi/*.msi      dist/windows-assets/
          find dist/windows-assets -type f

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: dist/windows-assets/*
          if-no-files-found: error
          # Same rationale as the macOS job's own retention-days above -
          # this is a handoff window to publish-release, not the artifacts'
          # real retention policy.
          retention-days: 5

  # -------------------------------------------------------------------
  # Assembles latest.json from the REAL .sig contents each platform job
  # produced, verifies it against the actual uploaded assets, and
  # publishes the GitHub Release. Runs even if one platform build failed -
  # shell/README.md's own contract explicitly allows a release that
  # "just omits windows-x86_64 rather than publishing a broken one" - but
  # never runs if BOTH failed (nothing to publish), and never runs at all
  # if preflight itself failed (missing secrets / dev pubkey).
  # -------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [preflight, build-macos, build-windows]
    if: ${{ always() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}

      - name: Download macOS release assets
        if: ${{ needs.build-macos.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: release-assets-macos
          path: dist/macos

      - name: Download Windows release assets
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: release-assets-windows
          path: dist/windows

      - name: Refuse to publish an empty release
        env:
          MACOS_RESULT: ${{ needs.build-macos.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
        run: |
          set -euo pipefail
          if [[ ! -d dist/macos && ! -d dist/windows ]]; then
            echo "::error::Neither platform produced assets (build-macos=$MACOS_RESULT, build-windows=$WINDOWS_RESULT) - refusing to publish an empty release." >&2
            exit 1
          fi

      - name: Clean up a leftover DRAFT from a previous failed attempt at this tag
        # A run that failed somewhere between "create the draft" and
        # "publish it" (network blip, a bad signature, etc.) leaves an
        # orphaned draft behind - harmless (invisible to the update
        # endpoint and the public releases page) but would make a retry's
        # own `gh release create` fail with "release already exists".
        # Only ever deletes a DRAFT, and only for THIS exact tag - a
        # PUBLISHED release already sitting on this tag is a genuine
        # conflict this workflow refuses to silently overwrite or delete.
        # The underlying git tag itself is never touched either way (no
        # --cleanup-tag) - Felix pushed it, this pipeline doesn't own it.
        #
        # `if: always()` (2026-07-17, 4R resilience fix): this step used to
        # inherit the job's default "only if every previous step succeeded"
        # behavior, so if BOTH build-macos and build-windows failed, the
        # "Refuse to publish an empty release" step above exits 1 and this
        # cleanup was skipped entirely - the tag's orphaned draft (if any,
        # from an earlier attempt that got further) then sits there and the
        # NEXT re-run of this same tag fails opaquely on `gh release create`
        # with "release already exists", no pointer back to "delete the
        # draft first". The cleanup script itself already tolerates "no
        # existing release" (`gh release view ... || true`) and already
        # refuses to touch a genuinely PUBLISHED release, so running it
        # unconditionally within this job is safe - it never blocks or
        # alters the "nothing to publish, fail the job" outcome, it just
        # also tidies up first. Deliberately still gated at the JOB level
        # on `needs.preflight.result == 'success'` (not loosened further) -
        # that's what guarantees TAG (this job's `needs.preflight.outputs.tag`)
        # is a real, validated value and not an empty string from a
        # preflight that failed before resolving it; a preflight failure
        # (bad SemVer, dev pubkey, missing secrets) never itself creates an
        # orphaned draft; only a publish-release run that got as far as
        # creating one does, so gating cleanup on preflight succeeding
        # rather than on the whole job's happy path is the correct,
        # narrower fix, not a blanket "run no matter what".
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          EXISTING_JSON="$(gh release view "$TAG" --repo fegone/Centinelo-Phone --json isDraft 2>/dev/null || true)"
          if [[ -z "$EXISTING_JSON" ]]; then
            echo "OK: no existing release for $TAG"
          elif [[ "$(jq -r .isDraft <<<"$EXISTING_JSON")" == "true" ]]; then
            echo "-- found a leftover DRAFT release for $TAG (from a previous failed/retried attempt) - deleting it before creating a fresh one"
            gh release delete "$TAG" --repo fegone/Centinelo-Phone --yes
          else
            echo "::error::A PUBLISHED (non-draft) release already exists for tag $TAG. This pipeline never overwrites or deletes a published release - if this is genuinely an intentional re-run, delete the existing release manually first (gh release delete $TAG), or use a new version." >&2
            exit 1
          fi

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # Notes: prefer the matching CHANGELOG.md section if one exists
          # for this version (none exists in this repo today - this repo
          # has no CHANGELOG.md yet, per the task's own "si existe" -
          # wired for the day one is added rather than skipped). Falls
          # back to a minimal, honest placeholder Felix can edit on the
          # release page afterward (`gh release edit`) - never blocks
          # publishing on notes content.
          if [[ -f CHANGELOG.md ]] && grep -q "^## \[\{0,1\}$VERSION" CHANGELOG.md; then
            awk -v ver="$VERSION" '
              BEGIN { printing = 0 }
              /^## / { if (printing) exit; if (index($0, ver) > 0) { printing = 1; next } }
              printing { print }
            ' CHANGELOG.md > dist/release-notes.txt
          fi
          if [[ ! -s dist/release-notes.txt ]]; then
            echo "Centinelo Phone $VERSION." > dist/release-notes.txt
          fi
          echo "-- dist/release-notes.txt --"
          cat dist/release-notes.txt

      - name: Create the release as a DRAFT with platform assets (not latest.json yet)
        # Draft, not published: GitHub's "latest release" alias
        # (tauri.conf.json's plugins.updater.endpoints - the ONLY thing
        # every installed app's auto-updater ever queries) never considers
        # draft releases, so this can never be picked up mid-construction
        # no matter how long the remaining steps take. latest.json is
        # deliberately NOT uploaded here yet - see the next step for why
        # (its asset URLs depend on knowing what GitHub actually named
        # these files, which is only knowable AFTER upload).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS=()
          [[ -d dist/macos ]] && ASSETS+=(dist/macos/*.dmg dist/macos/*.app.tar.gz dist/macos/*.app.tar.gz.sig)
          [[ -d dist/windows ]] && ASSETS+=(dist/windows/*.exe dist/windows/*.exe.sig dist/windows/*.msi)

          # Retry with backoff (2026-07-17, 4R resilience fix): a transient
          # GitHub API timeout here must not silently leave nothing
          # published when it could instead just... work on attempt 2. Each
          # of the 3 network calls in this job (create/upload/edit) defines
          # its own copy of this helper - each `run:` block is its own
          # shell process, nothing to share across steps. Still fails hard
          # (non-zero, `set -e` propagates it) once attempts are exhausted -
          # this is retry, not "swallow the failure".
          retry_gh() {
            local attempt=1 max=3 delay=5
            until "$@"; do
              if (( attempt >= max )); then
                echo "::error::gh command failed after $max attempts: $*" >&2
                return 1
              fi
              echo "-- attempt $attempt/$max failed ($*), retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$(( delay * 3 ))
              attempt=$(( attempt + 1 ))
            done
          }

          retry_gh gh release create "$TAG" \
            --repo fegone/Centinelo-Phone \
            --draft \
            --title "Centinelo Phone $VERSION" \
            --notes-file dist/release-notes.txt \
            "${ASSETS[@]}"

      - name: Resolve real asset names from GitHub and build latest.json
        # GitHub replaces spaces in asset filenames with periods, and a
        # DRAFT release's `.url` from the API is a placeholder
        # (`releases/download/untagged-<hash>/<name>`) that never becomes
        # correct once published. So: never read `.url` from the API -
        # take only the real `.name` and build `releases/download/<tag>/
        # <name>` ourselves, deterministically, from the tag already
        # resolved above.
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo fegone/Centinelo-Phone --json assets \
            --jq '.assets[] | .name' > dist/real-asset-names.txt
          echo "-- real asset names GitHub assigned --"
          cat dist/real-asset-names.txt

          find_real_name() {
            # $1: regex suffix to match against each name (case-sensitive,
            # matches this repo's own asset naming). Fails on zero OR
            # more-than-one match - a duplicate match would otherwise
            # silently pick an arbitrary one instead of failing loudly.
            awk -v suffix="$1" '$0 ~ (suffix "$"){print; n++} END{exit (n == 1) ? 0 : 1}' dist/real-asset-names.txt
          }

          download_url_for_name() {
            # Deterministic construction (see step comment above for why):
            # never derived from the API's `.url`, only from the tag this
            # job already resolved in preflight and the asset's real name.
            local name="$1" encoded
            encoded="$(jq -rn --arg n "$name" '$n | @uri')"
            printf 'https://github.com/fegone/Centinelo-Phone/releases/download/%s/%s' "$TAG" "$encoded"
          }

          PLATFORMS='{}'

          if [[ -d dist/macos ]]; then
            SIG="$(find dist/macos -maxdepth 1 -name '*.app.tar.gz.sig' | head -n1)"
            [[ -n "$SIG" ]] || { echo "::error::macOS assets downloaded but .app.tar.gz.sig missing locally" >&2; exit 1; }
            SIGNATURE="$(cat "$SIG")"
            NAME="$(find_real_name '\.app\.tar\.gz')" || { echo "::error::no uploaded release asset ends with .app.tar.gz - macOS updater artifact did not actually upload" >&2; exit 1; }
            URL="$(download_url_for_name "$NAME")"
            PLATFORMS="$(jq --arg sig "$SIGNATURE" --arg url "$URL" '. + {"darwin-aarch64": {signature: $sig, url: $url}}' <<<"$PLATFORMS")"
            echo "-- darwin-aarch64 -> $URL"
          fi

          if [[ -d dist/windows ]]; then
            SIG="$(find dist/windows -maxdepth 1 -name '*.exe.sig' | head -n1)"
            [[ -n "$SIG" ]] || { echo "::error::Windows assets downloaded but NSIS .exe.sig missing locally" >&2; exit 1; }
            SIGNATURE="$(cat "$SIG")"
            # `.exe` alone would also match `.exe.sig`'s own name (which
            # ends in .sig, not .exe, so it actually would NOT match -
            # but excluding it explicitly keeps this immune to a future
            # sig-naming change instead of relying on that distinction).
            NAME="$(awk '/\.exe$/ && !/\.exe\.sig$/{print; n++} END{exit (n == 1) ? 0 : 1}' dist/real-asset-names.txt)" || { echo "::error::no uploaded release asset ends with .exe (excluding .exe.sig), or more than one did - Windows updater artifact did not actually upload cleanly" >&2; exit 1; }
            URL="$(download_url_for_name "$NAME")"
            PLATFORMS="$(jq --arg sig "$SIGNATURE" --arg url "$URL" '. + {"windows-x86_64": {signature: $sig, url: $url}}' <<<"$PLATFORMS")"
            echo "-- windows-x86_64 -> $URL"
          fi

          if [[ "$PLATFORMS" == "{}" ]]; then
            echo "::error::No platform produced a valid signature+asset pair - refusing to publish latest.json with an empty platforms map." >&2
            exit 1
          fi

          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$(cat dist/release-notes.txt)" \
            --arg pub_date "$NOW" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > dist/latest.json

          echo "-- dist/latest.json --"
          cat dist/latest.json
          jq -e . dist/latest.json >/dev/null

      - name: Verify latest.json's signatures match the real local .sig files exactly
        # Belt-and-suspenders re-check, independent of the jq logic above:
        # each platform's signature field, byte for byte, must equal the
        # matching .sig file this job downloaded from build-macos/
        # build-windows - not a re-derivation, a literal re-comparison
        # against the same source of truth, so a jq quoting/escaping bug
        # in the step above would surface here rather than silently
        # shipping a manifest with a mismatched or truncated signature.
        run: |
          set -euo pipefail
          if [[ -d dist/macos ]]; then
            LOCAL_SIG="$(cat "$(find dist/macos -maxdepth 1 -name '*.app.tar.gz.sig' | head -n1)")"
            MANIFEST_SIG="$(jq -r '.platforms["darwin-aarch64"].signature' dist/latest.json)"
            [[ "$LOCAL_SIG" == "$MANIFEST_SIG" ]] || { echo "::error::darwin-aarch64 signature in latest.json does not match the local .sig file" >&2; exit 1; }
            echo "OK: darwin-aarch64 signature matches"
          fi
          if [[ -d dist/windows ]]; then
            LOCAL_SIG="$(cat "$(find dist/windows -maxdepth 1 -name '*.exe.sig' | head -n1)")"
            MANIFEST_SIG="$(jq -r '.platforms["windows-x86_64"].signature' dist/latest.json)"
            [[ "$LOCAL_SIG" == "$MANIFEST_SIG" ]] || { echo "::error::windows-x86_64 signature in latest.json does not match the local .sig file" >&2; exit 1; }
            echo "OK: windows-x86_64 signature matches"
          fi

      - name: Publish the release with binaries only (latest.json comes later, see next steps)
        # Publishing BEFORE latest.json is uploaded is deliberate (2026-08-12
        # RESILIENCE fix-pass): the URL construction above is already
        # deterministic from tag+name, so nothing requires latest.json to
        # exist before the release goes live. Publishing the binaries first
        # lets the next step verify their REAL download URLs - the exact
        # ones about to go into latest.json - against the real, published
        # release, before that manifest is the one artifact every installed
        # client's auto-updater trusts. If the verify step fails, the
        # release sits published with installers but no latest.json: a
        # missing/unfetchable manifest makes the plugin's own `check()`
        # reject with `Error::ReleaseNotFound` (tauri-plugin-updater
        # 2.10.1's updater.rs, `remote_release.ok_or(...)`) - the app
        # surfaces that as a quiet Settings-only status (`shouldShowBanner`
        # in shell/ui/js/updater.js excludes check-origin errors from the
        # main-window banner) and retries on the next check, never a
        # broken "update available" that 404s on download.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # Resolve the safe-by-default PRERELEASE decision described in
          # this file's top-of-file "Prerelease default" comment: a tag
          # push has no `inputs.prerelease` to read at all (DISPATCH_PRERELEASE
          # is empty), so it's treated the same as an explicit `true` -
          # `--latest` is reachable ONLY via workflow_dispatch with the
          # box deliberately unchecked. This is done in bash, not a GHA
          # `||` expression, on purpose: `inputs.prerelease == false || 'true'`
          # would evaluate to 'true' too, because GHA's `||` treats a
          # boolean `false` as falsy and falls through to the next
          # operand - it cannot distinguish "explicitly false" from
          # "absent" the way this decision needs to.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PRERELEASE="$DISPATCH_PRERELEASE"
          else
            PRERELEASE="true"
          fi
          FLAGS=(--draft=false)
          if [[ "$PRERELEASE" == "false" ]]; then
            # --latest: the app's own auto-updater endpoint is GitHub's
            # "latest release" alias - explicit here rather than relying
            # on gh's "automatic based on date and version" default,
            # since this repo's existing v1.0.0 release (a DIFFERENT,
            # older product line, still tagged/published from build.yml)
            # must not keep shadowing v2 releases as "Latest" just
            # because of tag/date ordering ambiguity.
            FLAGS+=(--latest)
          else
            FLAGS+=(--prerelease)
          fi
          # Retry with backoff (2026-07-17, 4R resilience fix) - see the
          # "Create the release as a DRAFT" step above for the full
          # rationale. This is the step that flips the release live.
          retry_gh() {
            local attempt=1 max=3 delay=5
            until "$@"; do
              if (( attempt >= max )); then
                echo "::error::gh command failed after $max attempts: $*" >&2
                return 1
              fi
              echo "-- attempt $attempt/$max failed ($*), retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$(( delay * 3 ))
              attempt=$(( attempt + 1 ))
            done
          }
          retry_gh gh release edit "$TAG" --repo fegone/Centinelo-Phone "${FLAGS[@]}"

      - name: Verify latest.json download URLs resolve (HTTP 200)
        # Trip-wire for the exact class of bug this pipeline shipped twice
        # in prod before 2026-08-12 (centinelo-v2.0.0, centinelo-v2.0.1): a
        # manifest that LOOKS well-formed but whose URL(s) 404 for every
        # real installed client. Runs AFTER "Publish the release" and
        # BEFORE "Upload latest.json" on purpose - `releases/download/
        # <tag>/<name>` is only guaranteed to resolve once the release is
        # published, and checking a URL before the manifest carrying it is
        # even uploaded means a failure here never leaves a broken
        # manifest live (see the previous step's comment for what a
        # missing manifest does instead). URLs are read straight from the
        # `dist/latest.json` this job already built (not re-derived from
        # `dist/macos`/`dist/windows` a third time), so this can never
        # silently diverge from what will actually be uploaded. A GitHub
        # asset that was JUST published can take a few seconds to become
        # servable from the CDN edge, hence retry with backoff.
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t urls < <(jq -r '.platforms[].url' dist/latest.json)
          [[ "${#urls[@]}" -gt 0 ]] || { echo "::error::latest.json has no platform URLs to verify - should be unreachable, publish-release already refused an empty platforms map earlier" >&2; exit 1; }

          fail=0
          for url in "${urls[@]}"; do
            code="000"
            max=5
            delay=5
            for (( attempt=1; attempt<=max; attempt++ )); do
              code="$(curl -sL --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "$url" || echo 000)"
              [[ "$code" == "200" ]] && break
              if (( attempt < max )); then
                echo "-- attempt $attempt/$max: $url -> HTTP $code, retrying in ${delay}s..." >&2
                sleep "$delay"
                delay=$(( delay * 2 ))
              fi
            done
            if [[ "$code" != "200" ]]; then
              echo "::error::latest.json URL unreachable after $max attempts (HTTP $code): $url - this is the auto-updater endpoint every installed client will hit. The release $TAG is now published WITHOUT latest.json (a broken-but-not-misleading state, see the publish step's comment - no client sees a fake update). This job's own 'Clean up a leftover DRAFT' step at the top of this SAME job refuses to touch a published release, so a plain re-run of this workflow for $TAG will fail there too. To retry: first delete this release (the git tag itself is untouched) with 'gh release delete $TAG --repo fegone/Centinelo-Phone --yes', THEN re-run this workflow for $TAG (workflow_dispatch, or move/re-push the tag)." >&2
              fail=1
            else
              echo "OK: $url -> HTTP 200"
            fi
          done
          [[ "$fail" -eq 0 ]] || exit 1

      - name: Upload latest.json to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          # Retry with backoff (2026-07-17, 4R resilience fix) - see the
          # "Create the release as a DRAFT" step above for the full
          # rationale. `gh release upload` works identically against an
          # already-published release as it did against the draft this
          # step used to run before - only the ORDER changed (2026-08-12
          # RESILIENCE fix-pass, see "Publish the release" step's comment),
          # not the upload mechanics themselves.
          retry_gh() {
            local attempt=1 max=3 delay=5
            until "$@"; do
              if (( attempt >= max )); then
                echo "::error::gh command failed after $max attempts: $*" >&2
                return 1
              fi
              echo "-- attempt $attempt/$max failed ($*), retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$(( delay * 3 ))
              attempt=$(( attempt + 1 ))
            done
          }
          retry_gh gh release upload "$TAG" --repo fegone/Centinelo-Phone dist/latest.json

      - name: Publish latest.json to the updater-manifest branch (beta update endpoint)
        # tauri.conf.json's plugins.updater.endpoints now lists TWO
        # endpoints: GitHub's `/releases/latest/download/` alias (first -
        # already correct the day 2.0 leaves beta and starts publishing
        # `--latest`, no config change needed that day) and this branch's
        # raw.githubusercontent.com URL (second - the one that actually
        # works TODAY, while every 2.0.x release is a prerelease). GitHub
        # excludes prereleases from the `/latest/` alias unconditionally,
        # so that first endpoint 404s for every installed client until
        # 2.0 leaves beta - see shell/README.md's "Contract for
        # release-ci" for the full endpoint rationale. tauri-plugin-
        # updater tries endpoints in array order and falls through to the
        # next on ANY failure (updater.rs:412-518) - so this second
        # endpoint is a plain fallback, not a replacement, and needs no
        # code change in the Rust shell.
        #
        # raw.githubusercontent.com serves a branch's file content
        # directly - it has no concept of "release" at all, so prerelease/
        # draft status is irrelevant to it. The branch is public-repo
        # content, on purpose scoped to ONLY
        # this one file: no README, no other files, ever - it exists
        # solely to be fetched by installed clients' auto-updaters, not to
        # be a real branch of source history. Uses GITHUB_TOKEN (already
        # `contents: write` for this job, see the job-level `permissions:`
        # above) - no new secret.
        #
        # Concurrency note (2026-08-13, RELIABILITY/RESILIENCE 4R pass):
        # this job's own `concurrency:` group is keyed by TAG (release
        # identity), so two DIFFERENT releases (e.g. 2.0.2 and 2.0.3) can
        # legitimately run this job at the same time - nothing serializes
        # writes to this branch across tags. Two deliberately partial
        # mitigations, not a fully atomic branch write (a dedicated
        # serialized job / branch-level lock was judged out of scope for
        # this pass):
        #   1. Refuse to regress: before overwriting, this step compares
        #      the version already on the branch (if any) against this
        #      run's VERSION with `sort -V` - if the branch already
        #      serves something newer, this run lost the race and skips
        #      its own write (a warning, not an error: the newer
        #      release's content is correct, no client sees anything
        #      broken).
        #   2. A genuine same-instant race on this branch's FIRST-EVER
        #      write (both runs see "branch does not exist" and both try
        #      to create it as an orphan) was a one-time bootstrap window
        #      - it no longer applies once the branch exists (this pass
        #      already created it, manually, to verify the mechanism
        #      end-to-end). If a comparable race ever recurs (e.g. the
        #      branch gets deleted and two releases race to recreate it),
        #      `push_with_retry`'s rebase-conflict handling below turns
        #      it into a clear, actionable failure instead of dying
        #      opaquely under `set -e`.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="updater-manifest"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/fegone/Centinelo-Phone.git"
          # GH_TOKEN is a GitHub Actions secret - the runner masks its
          # literal value from all logs automatically (including inside
          # this URL, on any error output), same as every other
          # GH_TOKEN-bearing step in this job.
          WORKDIR="$(mktemp -d)"

          # Printed verbatim in every failure message below: the release
          # itself is ALREADY published by the time this step can fail
          # (it runs after "Publish the release"), and re-running this
          # workflow for the same tag does NOT retry just this step - the
          # "Clean up a leftover DRAFT" step at the top of this job
          # refuses to touch an already-published release and fails
          # first. So a human has to do exactly what this step does, by
          # hand, against the real published release's own latest.json.
          recovery_hint="git clone https://github.com/fegone/Centinelo-Phone.git /tmp/updater-manifest-fix && cd /tmp/updater-manifest-fix && git checkout $BRANCH && curl -sL https://github.com/fegone/Centinelo-Phone/releases/download/$TAG/latest.json -o latest.json && git commit -am 'release: latest.json for $TAG (manual recovery)' && git push origin HEAD:$BRANCH"

          if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
            echo "-- $BRANCH exists, cloning it"
            git clone --quiet --depth 1 --branch "$BRANCH" "$REMOTE" "$WORKDIR"
          else
            echo "-- $BRANCH does not exist yet, creating it as an orphan branch (this file only, no history from main)"
            git clone --quiet --depth 1 "$REMOTE" "$WORKDIR"
            git -C "$WORKDIR" checkout --quiet --orphan "$BRANCH"
            git -C "$WORKDIR" rm -rf --quiet . >/dev/null 2>&1 || true
          fi

          # Refuse-to-regress check (mitigation 1 above) - BEFORE
          # overwriting the clone's own copy with this run's dist/latest.json.
          EXISTING_VERSION="$(jq -r '.version // empty' "$WORKDIR/latest.json" 2>/dev/null || true)"
          if [[ -n "$EXISTING_VERSION" && "$EXISTING_VERSION" != "$VERSION" ]]; then
            NEWER="$(printf '%s\n%s\n' "$EXISTING_VERSION" "$VERSION" | sort -V | tail -n1)"
            if [[ "$NEWER" == "$EXISTING_VERSION" ]]; then
              echo "::warning::$BRANCH already serves version $EXISTING_VERSION, newer than this run's $VERSION ($TAG) - another release most likely published concurrently and got there first. Leaving $BRANCH untouched rather than regressing it; the guard step right after this one will not treat this endpoint as proof for THIS release." >&2
              echo "BRANCH_PUSH_OK=0" >> "$GITHUB_ENV"
              rm -rf "$WORKDIR"
              exit 0
            fi
          fi

          cp dist/latest.json "$WORKDIR/latest.json"
          git -C "$WORKDIR" config user.name "centinelo-release-ci"
          git -C "$WORKDIR" config user.email "release-ci@users.noreply.github.com"
          git -C "$WORKDIR" add latest.json

          if git -C "$WORKDIR" diff --cached --quiet; then
            echo "OK: $BRANCH's latest.json already matches this release (no diff) - nothing to push"
            echo "BRANCH_PUSH_OK=1" >> "$GITHUB_ENV"
          else
            git -C "$WORKDIR" commit --quiet -m "release: latest.json for $TAG (beta update endpoint, version $VERSION)"
            push_with_retry() {
              local attempt=1 max=3 delay=5
              while true; do
                if git -C "$WORKDIR" push --quiet origin "HEAD:$BRANCH"; then
                  return 0
                fi
                if (( attempt >= max )); then
                  echo "::error::push to $BRANCH failed after $max attempts. $TAG is ALREADY published - installed clients relying on this endpoint (endpoint 1, GitHub's /latest/ alias, 404s by design during prerelease) will silently see NO update at all, not an error, until this is fixed by hand. Manual recovery: $recovery_hint" >&2
                  return 1
                fi
                echo "-- push attempt $attempt/$max failed, fetching + rebasing onto origin/$BRANCH then retrying in ${delay}s..." >&2
                if ! git -C "$WORKDIR" fetch --quiet origin "$BRANCH"; then
                  echo "::error::git fetch of $BRANCH failed while retrying the push (network issue, not a conflict). $TAG is ALREADY published. Manual recovery: $recovery_hint" >&2
                  return 1
                fi
                if ! git -C "$WORKDIR" rebase --quiet "origin/$BRANCH"; then
                  git -C "$WORKDIR" rebase --abort >/dev/null 2>&1 || true
                  echo "::error::git rebase onto origin/$BRANCH failed (a real content conflict - most likely two releases writing $BRANCH around the same time, or a recreated-branch race). Aborted the rebase rather than leaving the worktree half-rebased; NOT retrying automatically since a conflict needs a human to pick the right latest.json. $TAG is ALREADY published. Manual recovery: $recovery_hint" >&2
                  return 1
                fi
                sleep "$delay"
                delay=$(( delay * 3 ))
                attempt=$(( attempt + 1 ))
              done
            }
            push_with_retry
            echo "OK: pushed latest.json ($VERSION) to $BRANCH -> https://raw.githubusercontent.com/fegone/Centinelo-Phone/$BRANCH/latest.json"
            echo "BRANCH_PUSH_OK=1" >> "$GITHUB_ENV"
          fi
          rm -rf "$WORKDIR"

      - name: Guard - verify a configured updater endpoint actually resolves this release
        # This is the guard that was missing before this pass: the guard
        # above ("Verify latest.json download URLs resolve") only checks
        # the download URLs INSIDE the manifest, never the endpoint a real
        # installed client actually queries (tauri.conf.json's
        # plugins.updater.endpoints) - that gap is exactly how v2.0.0 and
        # v2.0.1 both shipped an auto-updater that could never find them.
        # Reads the endpoints straight from tauri.conf.json with jq (never
        # hardcoded here) so this guard tracks that file if it ever
        # changes, substitutes the plugin's own template variables
        # (updater.rs:413-440) defensively for any future endpoint that
        # uses them (today's two endpoints are both static, no templates),
        # and requires only that AT LEAST ONE configured endpoint serves
        # this exact version - matching the plugin's real behavior
        # (updater.rs:412-518: it tries each endpoint in order and stops
        # at the first one that works, so a client only ever needs ONE to
        # succeed). This also means the guard does not need a
        # skip-during-prerelease escape hatch: with the updater-manifest
        # branch as a second endpoint, SOME endpoint should resolve on
        # every release, prerelease or not - if none do, that is a real
        # regression, not an expected prerelease side effect.
        #
        # updater-manifest branch endpoint gets DIFFERENT treatment
        # (2026-08-13, RELIABILITY 4R pass): it fronts
        # raw.githubusercontent.com, served through Fastly with a cache
        # TTL measured in MINUTES, not seconds. The 5-attempt/~90s retry
        # budget below (copied from the neighboring "Verify latest.json
        # download URLs resolve" step) was sized for GitHub Release
        # assets, which propagate in seconds - too short for this
        # endpoint, and demonstrated for real the day before this pass:
        # a fixed asset was correct at origin (confirmed via the API) but
        # the CDN edge kept serving the stale copy for a while after.
        # Waiting out an undocumented, variable CDN TTL on every single
        # release (blocking the whole pipeline, with the release ALREADY
        # published) is a worse trade than trusting a cheaper, stronger
        # signal that already exists: the previous step's own git push
        # succeeding IS proof this endpoint's content is correct at
        # origin - raw.githubusercontent.com always converges to a
        # branch's real HEAD once its edge cache expires, there is no
        # permanent divergence to catch here. So when the previous step
        # confirms that (`BRANCH_PUSH_OK=1`), this endpoint is trusted
        # outright and gets one best-effort probe purely for visibility,
        # never a blocking retry loop. Deliberately NOT using a
        # cache-busting query string to force a fresh origin fetch: that
        # would tell us what Fastly's ORIGIN has, not what a real
        # installed client (which never sends a cache-buster) actually
        # sees right now - reporting the honest, possibly-stale edge
        # state is more useful here than an artificially "fixed" check.
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          BRANCH_PUSH_OK: ${{ env.BRANCH_PUSH_OK }}
        run: |
          set -euo pipefail
          BRANCH="updater-manifest"
          BRANCH_URL="https://raw.githubusercontent.com/fegone/Centinelo-Phone/$BRANCH/latest.json"

          mapfile -t endpoints < <(jq -r '.plugins.updater.endpoints[]' shell/src-tauri/tauri.conf.json)
          if [[ "${#endpoints[@]}" -eq 0 ]]; then
            echo "::error::tauri.conf.json has no plugins.updater.endpoints configured - no installed client could ever check for updates." >&2
            exit 1
          fi

          resolve_template() {
            local url="$1"
            url="${url//\{\{current_version\}\}/0.0.0}"
            url="${url//\{\{target\}\}/darwin-aarch64}"
            url="${url//\{\{arch\}\}/aarch64}"
            url="${url//\{\{bundle_type\}\}/app}"
            printf '%s' "$url"
          }

          any_ok=0
          for raw_url in "${endpoints[@]}"; do
            url="$(resolve_template "$raw_url")"

            if [[ "$url" == "$BRANCH_URL" && "${BRANCH_PUSH_OK:-0}" == "1" ]]; then
              # Trusted via the previous step's own git-push confirmation
              # (see this step's header comment) - probe once, informationally.
              raw="$(curl -sL --connect-timeout 5 --max-time 15 -w '\n%{http_code}' "$url" || printf '\n000')"
              code="$(tail -n1 <<<"$raw")"
              body="$(sed '$d' <<<"$raw")"
              seen_version="$(jq -r '.version // empty' <<<"$body" 2>/dev/null || true)"
              if [[ "$code" == "200" && "$seen_version" == "$VERSION" ]]; then
                echo "OK: $raw_url already serves version $VERSION (edge cache is warm)"
              else
                echo "-- $raw_url not yet reflecting version $VERSION at the edge (HTTP $code, version '${seen_version:-<none>}') - expected, Fastly's cache TTL is minutes; the previous step's successful push already confirmed this content is correct at origin, so this is informational only, not a failure."
              fi
              any_ok=1
              continue
            fi

            code="000"
            body=""
            max=5
            delay=5
            for (( attempt=1; attempt<=max; attempt++ )); do
              # One request, not two: -w appends the http_code as its own
              # trailing line after curl's normal stdout body, then the
              # response is split back apart below - same idea as this
              # job's "Verify latest.json download URLs resolve" step,
              # adapted here because that step only needed the code, this
              # one also needs the body to check `.version`.
              raw="$(curl -sL --connect-timeout 5 --max-time 15 -w '\n%{http_code}' "$url" || printf '\n000')"
              code="$(tail -n1 <<<"$raw")"
              body="$(sed '$d' <<<"$raw")"
              [[ "$code" == "200" ]] && break
              if (( attempt < max )); then
                echo "-- attempt $attempt/$max: $url -> HTTP $code, retrying in ${delay}s..." >&2
                sleep "$delay"
                delay=$(( delay * 2 ))
              fi
            done
            if [[ "$code" != "200" ]]; then
              echo "::warning::updater endpoint unreachable after $max attempts (HTTP $code): $raw_url (resolved: $url) - expected for the GitHub 'latest' alias while this release is a prerelease, see the trigger-design comment at the top of this file." >&2
              continue
            fi
            seen_version="$(jq -r '.version // empty' <<<"$body" 2>/dev/null || true)"
            if [[ "$seen_version" != "$VERSION" ]]; then
              echo "::warning::updater endpoint $raw_url served a manifest with version '$seen_version' (expected '$VERSION') - a real installed client hitting THIS endpoint would not see this release." >&2
              continue
            fi
            echo "OK: $raw_url resolves to version $VERSION"
            any_ok=1
          done

          if [[ "$any_ok" -eq 0 ]]; then
            echo "::error::NONE of tauri.conf.json's plugins.updater.endpoints resolve to the just-published version ($VERSION), and the updater-manifest branch push did not confirm this version either (BRANCH_PUSH_OK=${BRANCH_PUSH_OK:-0} - see the previous step's log; 0 there most often means another release published concurrently and got there first, see that step's regression-guard warning). An installed client's auto-updater would find no update at all for this release." >&2
            exit 1
          fi
          echo "OK: at least one configured updater endpoint resolves version $VERSION (or is confirmed correct at origin) - an installed client's auto-updater would find this release."

      - name: Job summary
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          {
            echo "## Release $TAG (Centinelo Phone $VERSION)"
            echo
            echo "| platform | shipped |"
            echo "|---|---|"
            echo "| macOS (darwin-aarch64) | $([[ -d dist/macos ]] && echo yes || echo 'NO - build-macos did not succeed') |"
            echo "| Windows (windows-x86_64) | $([[ -d dist/windows ]] && echo yes || echo 'NO - build-windows did not succeed') |"
            echo
            echo "https://github.com/fegone/Centinelo-Phone/releases/tag/$TAG"
            echo
            echo "Beta update endpoint (auto-updater fallback while 2.0.x stays prerelease):"
            echo "https://raw.githubusercontent.com/fegone/Centinelo-Phone/updater-manifest/latest.json"
          } >> "$GITHUB_STEP_SUMMARY"

