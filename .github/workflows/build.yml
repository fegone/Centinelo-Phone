name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege by default (RISK finding, release-ci audit 2026-08-16):
# the default GITHUB_TOKEN is already read-only, which is exactly what
# `smoke` needs. Only electron-builder's `--publish` call (build-win,
# build-mac) writes to GitHub Releases on a v* tag, so only those two jobs
# elevate to `contents: write`, each at the job level below - not here.
# Without this, EVERY job (including PR runs of `smoke` and `build-win`,
# which never publish) held a repo-write token for the run's duration: a
# compromised step anywhere in this workflow, on a pull_request trigger,
# would have had that scope available to it.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  build-win:
    needs: smoke
    runs-on: windows-latest
    # Only this job's electron-builder call ever publishes (on a v* tag
    # push - see the `--publish` step below); PR/branch runs take the
    # `--publish never` path and never touch this scope regardless.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      # Tag push (v*) → publish installer to a GitHub Release (auto-update feed).
      # Branch push → build only, upload as workflow artifact.
      - name: Build NSIS installer
        run: npx electron-builder --win --x64 ${{ startsWith(github.ref, 'refs/tags/v') && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: CentineloPhone-win-x64
          path: dist/*.exe
          if-no-files-found: error

  build-mac:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    # This job only ever runs on a v* tag push (see the `if:` above) and
    # always publishes - it needs the same elevated scope as build-win.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Build DMG
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
