name: shell build (v2 desktop shell)

# Builds shell/ (the Tauri v2 desktop app). Runs on `main` (2026-07-16:
# main now IS v2 — v2 was merged into main via phone PR #2 — so this is
# what actually gates merges there) plus `v2`/`v2-shell` while those
# integration branches still exist. Scoped by the `shell/**` path filter,
# not by branch alone: build.yml (v1 Electron) and core-build.yml (the
# native engine) both also watch `main`, so all three workflows
# legitimately fire together on a push touching multiple areas — that's
# expected, not a collision, since each builds an unrelated artifact and
# none depends on another's result.
#
# This job builds the shell app itself (Rust backend + static frontend) -
# it does NOT build core/, since shell/'s sidecar binary path is resolved
# at runtime (see src-tauri/src/sidecar.rs resolve_core_binary), not a
# compile-time dependency. core/ has its own CI in core-build.yml.
#
# --- Why `--config src-tauri/tauri.ci.conf.json` on the build steps ---
# tauri.conf.json has bundle.createUpdaterArtifacts=true AND the real
# production updater pubkey (plugins.updater.pubkey) — both are correct
# for RELEASES (release.yml builds updater artifacts and signs them with
# the offline TAURI_SIGNING_PRIVATE_KEY). But on every ordinary push this
# CI job only verifies that the app *compiles and bundles*; it produces no
# distributable artifact, so it must never hold the production signing
# key. Without that key, tauri build's signer fails hard:
#   "A public key has been found, but no private key. Make sure to set
#    TAURI_SIGNING_PRIVATE_KEY environment variable."
# That broke every run since the production pubkey landed (2026-07-18).
# The fix: pass a CI-only config (src-tauri/tauri.ci.conf.json) that sets
# createUpdaterArtifacts=false. It is DEEP-MERGED onto tauri.conf.json by
# the Tauri CLI, so EVERYTHING else (the full Rust release compile, the
# static frontend, the .app / .exe bundling, the macOS entitlements,
# windows webview/nsis config) is verified exactly as before — only the
# updater .tar.gz/.zip + .sig (the sole step that needs the private key)
# is skipped. The pubkey in tauri.conf.json is left untouched.

on:
  push:
    branches: [main, v2, v2-shell]
    paths:
      - 'shell/**'
      - '.github/workflows/shell-build.yml'
  pull_request:
    branches: [main, v2, v2-shell]
    paths:
      - 'shell/**'
      - '.github/workflows/shell-build.yml'

# A PR from v2 (or v2-shell) into main fires push (on the head branch) AND
# pull_request for the same commit - two redundant runs. Group by
# workflow+ref so the second dedupes against the first; cancel-in-progress
# only cancels a STALE run of the SAME branch/ref (e.g. a superseded push
# to that PR), never a run on a different branch like main.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Explicit least privilege (RISK finding, release-ci audit 2026-08-16):
# this workflow only checks out, compiles, and bundles - no publish step,
# no writes to the repo. It previously had no `permissions:` block, so it
# silently inherited whatever this repo's/org's Actions default is
# (verified 2026-08-16 via `gh api
# repos/fegone/Centinelo-Phone/actions/permissions/workflow` ->
# `default_workflow_permissions: "read"`, so there was no live excess
# scope) - but that default is a setting anyone with repo admin can flip
# without touching this file. Declaring it here removes the dependency on
# that external, unversioned setting.
permissions:
  contents: read

jobs:
  macos:
    name: macOS (supported)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install JS dependencies (Tauri CLI + API)
        run: npm ci

      - name: Rust toolchain
        run: rustup show

      - name: cargo check (fast compile-time sanity)
        working-directory: shell/src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: shell/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build the Tauri app (.app bundle, no updater signing)
        # --bundles app (not the default "all"): DMG creation shells out to
        # Finder/AppleScript to lay out the installer window, which is
        # unnecessary flakiness for a routine build-verification job - a
        # release workflow can build the full DMG separately.
        # --config disables updater-artifact signing for CI (see header).
        # CENTINELO_ALLOW_DEV_SIGNING_KEYS: this is a --release compile
        # (tauri build always builds release) that never ships anywhere -
        # build.rs's release key-gate check (RISK finding, licensing
        # agent, 2026-08-16) would otherwise fail this build for still
        # holding the documented dev/test placeholder Ed25519 keys in
        # src/premium.rs / src/activation.rs, which is correct for a REAL
        # release build but not for this PR-verification job. See that
        # check's own doc comment in shell/src-tauri/build.rs for the full
        # rule and why this is one of the named-legitimate exceptions.
        env:
          CENTINELO_ALLOW_DEV_SIGNING_KEYS: "1"
        run: npx tauri build --bundles app --config src-tauri/tauri.ci.conf.json

  windows:
    name: Windows (experimental, allowed to fail)
    runs-on: windows-latest
    # Not validated locally before this branch was pushed (no Windows
    # machine available this session) - same caveat as core-build.yml's
    # own Windows job. The Rust backend cfg-gates every unix-only bit
    # (file permissions, SIGKILL vs taskkill) so it *should* build, but
    # that's unverified here.
    continue-on-error: true
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install JS dependencies (Tauri CLI + API)
        run: npm ci

      - name: cargo check (fast compile-time sanity)
        working-directory: shell/src-tauri
        run: cargo check --all-targets

      - name: Build the Tauri app (NSIS installer, no updater signing)
        # "app" is a macOS-only bundle type; nsis is Windows' equivalent
        # default. Unverified on real Windows this session - this whole
        # job is continue-on-error for exactly that reason.
        # --config disables updater-artifact signing for CI (see header):
        # without it the same "public key found, no private key" error
        # that broke macOS would break Windows too.
        # CENTINELO_ALLOW_DEV_SIGNING_KEYS: same reason as the macOS job
        # above - this is a --release compile that never ships, see that
        # job's comment.
        env:
          CENTINELO_ALLOW_DEV_SIGNING_KEYS: "1"
        run: npx tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json
